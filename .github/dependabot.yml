# Mises à jour proposées chaque semaine (pull requests), pour les dépendances Go de labctl et les actions
# GitHub épinglées par SHA dans .github/workflows/.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /labctl
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
