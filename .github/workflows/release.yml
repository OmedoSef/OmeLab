# Publie une Release GitHub de labctl : tests, tag de version, artefacts (binaire, installeur, paquet .deb,
# schéma de module.yaml, une archive par module) avec leurs empreintes, attachés à la Release.
#
# Lancement : onglet Actions -> « Release » -> Run workflow, en saisissant la version (ex. v1.0.0).
# Rien n'est publié si les contrôles (job checks, sans droit d'écriture) ou la compilation échouent : le tag n'est
# poussé qu'à la fin.
# Les actions tierces sont épinglées par SHA de commit (Dependabot propose les mises à jour).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (format vX.Y.Z, ex. v1.0.0)"
        required: true

permissions:
  contents: read

jobs:
  # Contrôles complets dans un job sans droit d'écriture : les outils tiers qu'ils lancent (govulncheck,
  # staticcheck) ne côtoient jamais le jeton qui pousse le tag et publie la Release.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: labctl/go.sum

      - name: Outils de test (qemu-img pour les tests de disques et de création de VM)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends qemu-utils

      - name: Contrôles de la CI (rien n'est publié s'ils échouent)
        run: labctl/build.sh ci

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write # créer le tag et la Release
    env:
      # Passée par l'environnement, jamais insérée dans un script : pas d'injection de commande possible
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Vérifier le format de la version
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version invalide : attendue vX.Y.Z"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # historique complet : git describe doit voir le tag

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: labctl/go.sum

      - name: Tag de version, local pour l'instant
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "labctl $VERSION"

      - name: Construire les artefacts
        run: labctl/build.sh release # git describe voit le tag -> version gravée dans le binaire

      - name: Empreintes de tous les artefacts
        working-directory: dist
        run: sha256sum labctl install.sh module.schema.json labctl_*_linux-amd64.tar.gz ./*.deb modules/*.tar.gz > SHA256SUMS

      - name: Pousser le tag et publier la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin "$VERSION"
          gh release create "$VERSION" --verify-tag --title "labctl $VERSION" --generate-notes \
            dist/labctl dist/labctl.sha256 dist/SHA256SUMS dist/install.sh dist/module.schema.json \
            dist/labctl_*_linux-amd64.tar.gz dist/*.deb dist/modules/*.tar.gz
