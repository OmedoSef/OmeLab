# Serveur HTTPS de démonstration. Modèle : les variables sont remplacées à la copie dans la VM.
# Certificat émis par la CA du module (voir certificates: dans module.yaml).
server {
  listen 443 ssl;
  server_name www.${module.domain} srv.${module.domain} ${vm.ip};

  ssl_certificate     /etc/ssl/sample/web.crt;
  ssl_certificate_key /etc/ssl/sample/web.key;

  root /var/www/html;
  index index.html;
}

# HTTP -> HTTPS
server {
  listen 80;
  server_name www.${module.domain} srv.${module.domain} ${vm.ip};
  return 301 https://$host$request_uri;
}
