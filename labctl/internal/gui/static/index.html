<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labs</title>
<style>
:root {
  --bg: #f5f6f8; --panel: #ffffff; --text: #1d2330; --muted: #667085; --line: #e3e6eb;
  --accent: #2f6fde; --ok: #1e9e5a; --warn: #c98a12; --bad: #d1433b; --off: #98a2b3;
  --chip: #eef2f8; --log: #0f141c; --logtext: #d4dae3;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11151c; --panel: #181e27; --text: #e4e8ee; --muted: #8b95a5; --line: #283140;
    --accent: #5b93f0; --ok: #3cc47c; --warn: #e0a83a; --bad: #ef6b63; --off: #5d6878;
    --chip: #222a36; --log: #0a0e14; --logtext: #c9d1dc;
  }
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
header h1 { font-size: 18px; margin: 0; }
.spacer { flex: 1; }
main { padding: 20px 24px 280px; display: grid; gap: 18px; max-width: 1200px; margin: 0 auto; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.card-head h2 { font-size: 16px; margin: 0; }
.meta { color: var(--muted); font-size: 13px; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 9px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; background: var(--off); vertical-align: middle; }
.dot.running { background: var(--ok); } .dot.paused { background: var(--warn); } .dot.absente { background: transparent; border: 1px solid var(--off); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--chip); font-size: 12px; white-space: nowrap; }
.pill.open { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); font-weight: 600; }
.pill.never { color: var(--bad); }
.pill.on { color: var(--ok); }
button, select, input { font: inherit; color: inherit; }
button { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 5px 11px; cursor: pointer; white-space: nowrap; }
button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover:not(:disabled) { color: #fff; filter: brightness(1.08); }
button.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
select, input { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 5px 8px; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.links { padding: 14px 16px; overflow-x: auto; }
.links table td, .links table th { text-align: center; padding: 8px 12px; }
.links table th:first-child, .links table td:first-child { text-align: left; }
.empty { padding: 18px 16px; color: var(--muted); }
#log { position: fixed; left: 0; right: 0; bottom: 0; height: 240px; background: var(--log); color: var(--logtext); display: flex; flex-direction: column; border-top: 1px solid var(--line); z-index: 3; }
#log.collapsed { height: 38px; }
#log .bar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; font-size: 13px; border-bottom: 1px solid #1f2733; }
#log .bar button { background: transparent; color: var(--logtext); border-color: #2c3645; padding: 2px 9px; }
#log pre { margin: 0; padding: 10px 16px; overflow: auto; flex: 1; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
#log.collapsed pre { display: none; }
.busy { color: var(--warn); }
.err { color: var(--bad); }
nav.tabs { display: flex; gap: 4px; }
nav.tabs button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; color: var(--muted); }
nav.tabs button.active { background: var(--chip); color: var(--text); font-weight: 600; }
.view { display: grid; gap: 18px; }
.view[hidden] { display: none; }
form.inline { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; padding: 14px 16px; }
form.inline label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
form.inline label.check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; padding: 14px 16px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.dot.active, .dot.ok { background: var(--ok); } .dot.failed { background: var(--bad); }
.warn { color: var(--warn); }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 16px; border-radius: 10px;
  border: 1px solid color-mix(in srgb, var(--warn) 50%, transparent); background: color-mix(in srgb, var(--warn) 12%, var(--panel)); }
.banner.ok { border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: color-mix(in srgb, var(--ok) 10%, var(--panel)); }
.diff { margin: 0; padding: 10px 16px; overflow-x: auto; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; border-top: 1px solid var(--line); }
.diff .add { color: var(--ok); } .diff .del { color: var(--bad); } .diff .skip { color: var(--muted); }
nav.tabs .count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--warn); color: #fff; font-size: 11px; }
/* Éditeur de module.yaml : texte transparent au-dessus d'une copie colorée */
.ed-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.ed-bar .state { font-size: 13px; }
.editor { --lh: 20px; position: relative; display: grid; grid-template-columns: max-content 1fr; height: min(62vh, 640px);
  font: 13px/var(--lh) ui-monospace, SFMono-Regular, Menlo, monospace; tab-size: 2; }
.editor .gutter { overflow: hidden; padding: 10px 0; background: var(--chip); color: var(--muted); text-align: right; user-select: none; border-right: 1px solid var(--line); }
.editor .gutter div { padding: 0 10px 0 14px; height: var(--lh); }
.editor .gutter .e { color: #fff; background: var(--bad); } .editor .gutter .w { color: #fff; background: var(--warn); }
.editor .area { position: relative; overflow: hidden; }
.editor pre, .editor textarea { position: absolute; inset: 0; margin: 0; padding: 10px 14px; border: 0; font: inherit; line-height: var(--lh);
  white-space: pre; overflow: auto; tab-size: 2; letter-spacing: normal; word-spacing: normal; }
.editor pre { pointer-events: none; color: var(--text); overflow: hidden; }
.editor textarea { background: transparent; color: transparent; caret-color: var(--text); resize: none; outline: none; }
.editor textarea::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); color: transparent; }
.editor .ln { display: block; height: var(--lh); }
.editor .ln.e { background: color-mix(in srgb, var(--bad) 14%, transparent); } .editor .ln.w { background: color-mix(in srgb, var(--warn) 12%, transparent); }
.editor .ln.cur { box-shadow: inset 3px 0 0 var(--accent); }
.y-k { color: var(--accent); } .y-s { color: var(--ok); } .y-n { color: #b45bd6; } .y-c { color: var(--muted); font-style: italic; }
.y-v { color: var(--warn); font-weight: 600; } .y-p { color: var(--muted); }
.issues { list-style: none; margin: 0; padding: 6px 0; border-top: 1px solid var(--line); max-height: 180px; overflow: auto; }
.issues li { display: flex; gap: 10px; padding: 4px 16px; cursor: pointer; font-size: 13px; }
.issues li:hover { background: var(--chip); }
.issues .lvl { min-width: 64px; font-weight: 600; } .issues .e .lvl { color: var(--bad); } .issues .w .lvl { color: var(--warn); }
.issues .ok { color: var(--ok); cursor: default; }
@media (max-width: 760px) {
  header, main { padding-left: 16px; padding-right: 16px; }
  th:nth-child(3), td:nth-child(3) { display: none; }
}
</style>
</head>
<body>
<header>
  <h1>Labs</h1>
  <nav class="tabs">
    <button data-tab="modules">Modules</button>
    <button data-tab="editor">module.yaml</button>
    <button data-tab="config">Configuration<span id="pending-count"></span></button>
    <button data-tab="core">Core</button>
    <button data-tab="pki">PKI</button>
  </nav>
  <span id="gw" class="pill">passerelle…</span>
  <span class="actions" id="gw-actions"></span>
  <span class="spacer"></span>
  <span id="updated" class="meta"></span>
  <button id="refresh" title="Rafraîchir">↻</button>
</header>
<main>
  <div class="view" id="main"><div class="empty">Chargement…</div></div>
  <div class="view" id="view-editor" hidden><div class="empty">Chargement…</div></div>
  <div class="view" id="view-config" hidden><div class="empty">Chargement…</div></div>
  <div class="view" id="view-core" hidden><div class="empty">Chargement…</div></div>
  <div class="view" id="view-pki" hidden><div class="empty">Chargement…</div></div>
</main>

<section id="log" class="collapsed">
  <div class="bar">
    <strong>Journal</strong><span id="log-status" class="meta"></span>
    <span class="spacer"></span>
    <button id="log-clear">Effacer</button>
    <button id="log-toggle">Afficher</button>
  </div>
  <pre id="log-out"></pre>
</section>

<script>
"use strict";
const token = new URLSearchParams(location.hash.slice(1)).get("t") || "";
// Nouvelle adresse (labctl gui relancé) collée dans un onglet déjà ouvert : seul le fragment change,
// le navigateur ne recharge pas ; on recharge pour prendre le nouveau jeton
addEventListener("hashchange", () => location.reload());
const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let state = null, running = false, core = null, pki = null, config = null, showDiff = false;
let tab = "modules";
try { tab = localStorage.getItem("labs-tab") || "modules"; } catch {}

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "X-Lab-Token": token, "Content-Type": "application/json", ...(opts.headers || {}) } });
  if (!r.ok) throw new Error((await r.text()).trim() || r.statusText);
  return r;
}

function showTab(t) {
  tab = ["modules", "editor", "config", "core", "pki"].includes(t) ? t : "modules";
  try { localStorage.setItem("labs-tab", tab); } catch {}
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  $("#main").hidden = tab !== "modules";
  $("#view-core").hidden = tab !== "core";
  $("#view-config").hidden = tab !== "config";
  $("#view-pki").hidden = tab !== "pki";
  $("#view-editor").hidden = tab !== "editor";
  if (tab === "editor") openEditor(); else if (tab === "core") loadCore(); else if (tab === "pki") loadPKI(); else if (tab === "config") loadConfig();
}

async function loadConfig() {
  try { config = await (await api("/api/config")).json(); renderConfig(); }
  catch (e) { $("#view-config").innerHTML = `<div class="empty err">${esc(e.message)}</div>`; }
}

async function editConfig(body) {
  try { await api("/api/config", { method: "POST", body: JSON.stringify(body) }); await loadConfig(); return true; }
  catch (e) { alert(e.message); return false; }
}

async function loadCore(fresh = false) {
  try { core = await (await api("/api/core" + (fresh ? "?fresh" : ""))).json(); renderCore(); }
  catch (e) { $("#view-core").innerHTML = `<div class="empty err">${esc(e.message)}</div>`; }
}

async function loadPKI() {
  try { pki = await (await api("/api/pki")).json(); renderPKI(); }
  catch (e) { $("#view-pki").innerHTML = `<div class="empty err">${esc(e.message)}</div>`; }
}

async function download(path) {
  try {
    const blob = await (await api("/api/pki/file?path=" + encodeURIComponent(path))).blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = path.split("/").pop();
    document.body.append(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
  } catch (e) { alert(e.message); }
}

async function load(fresh = false) {
  try {
    state = await (await api("/api/state" + (fresh ? "?fresh" : ""))).json();
    render();
    $("#updated").textContent = "à jour " + new Date().toLocaleTimeString();
  } catch (e) {
    $("#updated").innerHTML = `<span class="err">${esc(e.message)}</span>`;
  }
}

// --- Exécution d'une commande labctl, sortie affichée au fil de l'eau
async function run(args, confirmText) {
  if (running) return;
  if (confirmText && !confirm(confirmText)) return;
  running = true; render();
  const log = $("#log-out");
  $("#log").classList.remove("collapsed"); $("#log-toggle").textContent = "Masquer";
  const shown = `labctl ${args.join(" ")}`;
  $("#log-status").innerHTML = `<span class="busy">en cours : ${esc(shown)}</span>`;
  log.textContent += `\n$ ${shown}\n`;
  try {
    const r = await api("/api/run", { method: "POST", body: JSON.stringify({ args }) });
    const reader = r.body.getReader(), dec = new TextDecoder();
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      // Retire les codes couleur ANSI des scripts
      log.textContent += dec.decode(value, { stream: true }).replace(/\x1b\[[0-9;]*m/g, "");
      log.scrollTop = log.scrollHeight;
    }
    $("#log-status").textContent = "";
  } catch (e) {
    log.textContent += `[erreur : ${e.message}]\n`;
    $("#log-status").innerHTML = `<span class="err">${esc(e.message)}</span>`;
  } finally {
    running = false; log.scrollTop = log.scrollHeight;
    await load(true);
    if (tab === "core") await loadCore(true);
    if (tab === "pki") await loadPKI();
    if (tab === "config") await loadConfig();
  }
}

async function console_(vm) {
  try { await api("/api/console", { method: "POST", body: JSON.stringify({ vm }) }); }
  catch (e) { alert(e.message); }
}

// --- Rendu
function render() {
  if (!state) return;
  const gwUp = state.gateway.state === "running";
  $("#gw").innerHTML = `<span class="dot ${gwUp ? "running" : ""}"></span>passerelle core-gw : ${esc(state.gateway.state)}`;
  $("#gw-actions").innerHTML = gwUp
    ? `<button data-run='["core","stop"]' data-confirm="Arrêter la passerelle ? Les modules perdent DHCP, DNS et Internet.">Arrêter</button>`
    : `<button class="primary" data-run='["core","start"]'>Démarrer</button>`;

  const mods = state.modules || [];
  const dis = running || !gwUp ? "disabled" : "";
  const busy = running ? "disabled" : "";
  let html = "";
  for (const m of mods) {
    const has = c => (m.commands || []).includes(c);
    const openAll = m.internetAll;
    html += `<section class="card">
      <div class="card-head">
        <h2>${esc(m.name)}</h2>
        <span class="meta mono">${esc(m.subnet)}.0/24 · ${esc(m.domain)}</span>
        ${m.netActive ? "" : `<span class="pill never">réseau ${esc(m.net)} inactif</span>`}
        <span class="spacer"></span>
        <span class="pill ${m.internet !== "fermé" ? "open" : ""}">Internet : ${esc(m.internet)}</span>
        ${has("up") ? `<button data-edit-module="${esc(m.name)}" title="Modifier modules/${esc(m.name)}/module.yaml">module.yaml</button>` : ""}
        <span class="actions">
          ${openAll
            ? `<button ${dis} data-run='${esc(JSON.stringify(["core", "internet", "off", m.name]))}'>Fermer Internet</button>`
            : `<button ${dis} data-run='${esc(JSON.stringify(["core", "internet", "on", m.name]))}' data-confirm="Ouvrir Internet à tout le module ${esc(m.name)} (sauf VMs « jamais ») ?">Ouvrir à tout le module</button>
               ${m.internet !== "fermé" ? `<button ${dis} data-run='${esc(JSON.stringify(["core", "internet", "off", m.name]))}'>Tout fermer</button>` : ""}`}
        </span>
      </div>
      <div class="meta" style="padding:8px 16px;border-bottom:1px solid var(--line)">${esc(m.description)}</div>
      <table>
        <thead><tr><th>VM</th><th>IP</th><th>Snapshots</th><th>Internet</th><th>Actions</th></tr></thead>
        <tbody>`;
    for (const v of m.vms || []) {
      const up = v.state === "running", exists = v.state !== "absente";
      const snaps = v.snapshots || [];
      let net;
      if (v.noInternet) net = `<span class="pill never">jamais</span>`;
      else if (openAll) net = `<span class="pill open">ouvert (module)</span>`;
      else if (v.internet) net = `<span class="pill open">ouvert</span> <button ${dis} data-run='${esc(JSON.stringify(["core", "internet", "off", m.name, v.name]))}'>Fermer</button>`;
      else net = `<span class="pill">fermé</span> <button ${dis} data-run='${esc(JSON.stringify(["core", "internet", "on", m.name, v.name]))}'>Ouvrir</button>`;
      html += `<tr>
        <td><span class="dot ${esc(v.state.replace(" ", "-"))}"></span><strong>${esc(v.name)}</strong> <span class="meta">${esc(v.state)}</span></td>
        <td class="mono">${esc(v.ip)}</td>
        <td class="meta">${snaps.length ? esc(snaps.join(", ")) : "—"}</td>
        <td>${net}</td>
        <td><div class="actions">${!exists
          ? (has("up") ? `<button ${busy} data-run='${esc(JSON.stringify([m.name, "up", v.name]))}'>Créer</button>`
            : has(v.name) ? `<button ${busy} data-run='${esc(JSON.stringify([m.name, v.name]))}'>Créer</button>` : `<span class="meta">absente</span>`)
          : `${has("start") && !up ? `<button ${busy} data-run='${esc(JSON.stringify([m.name, "start", v.name]))}'>Démarrer</button>` : ""}
             ${has("stop") && up ? `<button ${busy} data-run='${esc(JSON.stringify([m.name, "stop", v.name]))}'>Arrêter</button>` : ""}
             ${up ? `<button data-console="${esc(v.libvirt)}">Console</button>` : ""}
             ${has("snapshot") ? `<button ${busy} data-snapshot='${esc(JSON.stringify([m.name, v.name]))}'>Snapshot</button>` : ""}
             ${has("restore") && snaps.length ? `<button class="danger" ${busy} data-restore='${esc(JSON.stringify([m.name, v.name, snaps]))}'>Restaurer…</button>` : ""}`}
        </div></td></tr>`;
    }
    if (!(m.vms || []).length) html += `<tr><td colspan="5" class="empty">Aucune VM déclarée</td></tr>`;
    html += `</tbody></table>
      <div class="card-head" style="border-top:1px solid var(--line);border-bottom:0">
        <span class="meta">Commande du module :</span>
        <input class="mono" style="flex:1;min-width:200px" placeholder="ex. status  ·  kali  ·  snapshot msf2 avant-exploit" data-cmd="${esc(m.name)}">
        <button ${busy} data-cmd-run="${esc(m.name)}">Lancer</button>
      </div>
    </section>`;
  }

  if (!mods.length) html = `<div class="empty">Aucun module avec réseau (module.env).</div>`;

  const focus = document.activeElement?.dataset?.cmd, val = focus ? document.activeElement.value : "";
  $("#main").innerHTML = html;
  if (focus) { const el = $(`[data-cmd="${CSS.escape(focus)}"]`); el.value = val; el.focus(); }
}

// --- Vue Configuration : core.conf de chaque module, changements en attente, application
function renderConfig() {
  const c = config, busy = running ? "disabled" : "";
  if (!c) return;
  const mods = c.modules || [], pending = c.pending || [], gwUp = c.gateway === "running";
  $("#pending-count").innerHTML = pending.length ? `<span class="count" title="fichiers à mettre à jour sur la passerelle">${pending.length}</span>` : "";
  let h = "";
  if (!gwUp) {
    h += `<div class="banner"><span>Passerelle ${esc(c.gateway)} : les modifications sont enregistrées dans les core.conf et seront appliquées au prochain démarrage (Core → Appliquer la configuration).</span></div>`;
  } else if (c.pendingError) {
    h += `<div class="banner"><span class="err">${esc(c.pendingError)}</span></div>`;
  } else if (pending.length) {
    h += `<section class="card"><div class="banner" style="border:0;border-radius:0">
        <strong>Modifications non appliquées</strong>
        <span class="meta">${pending.length} fichier(s) de la passerelle changeront : ${pending.map(f => esc(f.file)).join(", ")}</span>
        <span class="spacer"></span>
        <button data-toggle-diff>${showDiff ? "Masquer" : "Voir"} les changements</button>
        <button class="primary" ${busy} data-run='["core","apply"]'>Appliquer sur la passerelle</button>
      </div>
      ${showDiff ? pending.map(f => `<pre class="diff"><strong>${esc(f.file)}</strong>\n${f.lines.map(l =>
        l.op === "…" ? `<span class="skip">  …</span>` : `<span class="${l.op === "+" ? "add" : l.op === "-" ? "del" : ""}">${esc(l.op)} ${esc(l.text)}</span>`).join("\n")}</pre>`).join("") : ""}
    </section>`;
  } else {
    h += `<div class="banner ok"><span>La passerelle est à jour avec la configuration des modules.</span></div>`;
  }

  for (const m of mods) {
    const aliases = Object.entries(m.aliases || {}).sort();
    const targets = (m.hosts || []).map(x => x.name);
    h += `<section class="card"><div class="card-head"><h2>${esc(m.name)}</h2>
        <span class="meta mono">${esc(m.subnet)}.0/24 · ${esc(m.domain)} · core.conf</span></div>
      <table><thead><tr><th>Réservation DHCP / nom DNS</th><th>IP</th><th>MAC</th><th>Source</th><th></th></tr></thead><tbody>
      ${(m.hosts || []).sort((a, b) => a.ip.localeCompare(b.ip, undefined, { numeric: true })).map(x => `<tr>

// Formulaires PKI -> arguments de labctl pki
document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-form]");
  if (!f) return;
  e.preventDefault();
  const v = Object.fromEntries(new FormData(f));
  const csv = s => (s || "").split(/[\s,]+/).filter(Boolean).join(",");
  if (f.dataset.form === "subca") {
    const args = ["pki", "sub-ca", v.name, "-D", v.domain.trim()];
    if (v.subnet.trim()) args.push("-s", v.subnet.trim());
    run(args, `Créer la CA dérivée « ${v.name} », limitée à ${v.domain}${v.subnet ? " et " + v.subnet : ""} ?`);
  } else if (f.dataset.form === "issue") {
    const args = ["pki", "issue", v.name.trim()];
    if (v.ca) args.push("-C", v.ca);
    if (csv(v.dns)) args.push("-d", csv(v.dns));
    if (csv(v.ip)) args.push("-i", csv(v.ip));
    if (v.days) args.push("--days", v.days);
    if (v.client) args.push("--client");
    if (v.pfx) args.push("--pfx");
    run(args);
  } else if (f.dataset.form === "trust") {
    run(["pki", "trust-vm", v.vm], `Installer la CA racine Omedo Labs dans ${v.vm} (par SSH) ?`);
  }
});

// --- Éditeur de module.yaml : coloration, numéros de ligne, validation à la volée
const ed = { want: "", modules: [], name: "", text: "", saved: "", hash: "", create: false, issues: [], timer: 0, seq: 0, msg: "" };
const dirty = () => ed.name && ed.text !== ed.saved;
addEventListener("beforeunload", e => { if (dirty()) e.preventDefault(); });

async function openEditor() {
  const name = ed.want; ed.want = "";
  try { ed.modules = (await (await api("/api/modules")).json()).modules; }
  catch (e) { $("#view-editor").innerHTML = `<div class="empty err">${esc(e.message)}</div>`; return; }
  if (name && name !== ed.name) { if (!(await loadModuleText(name))) return; }
  else if (!ed.name && ed.modules.length) { if (!(await loadModuleText(ed.modules[0]))) return; }
  renderEditor();
}

async function loadModuleText(name) {
  if (dirty() && !confirm(`Abandonner les modifications non enregistrées de ${ed.name} ?`)) return false;
  try {
    const d = await (await api("/api/module?name=" + encodeURIComponent(name))).json();
    Object.assign(ed, { name, text: d.text, saved: d.text, hash: d.hash, create: false, issues: d.issues, msg: "" });
    return true;
  } catch (e) { alert(e.message); return false; }
}

// Relit le fichier sur le disque (abandonne les modifications, après confirmation)
async function reloadModule() {
  if (dirty() && !confirm(`Abandonner les modifications et relire modules/${ed.name}/module.yaml ?`)) return;
  const name = ed.name;
  ed.saved = ed.text; // la question vient d'être posée
  if (await loadModuleText(name)) renderEditor();
}

async function newModule() {
  if (dirty() && !confirm(`Abandonner les modifications non enregistrées de ${ed.name} ?`)) return;
  const name = (prompt("Nom du nouveau module (minuscules, chiffres, tirets ; 9 caractères au plus) :") || "").trim();
  if (!name) return;
  if (!/^[a-z0-9]([a-z0-9-]*[a-z0-9])?$/.test(name) || name.length > 9) { alert("Nom invalide : minuscules, chiffres, tirets, 9 caractères au plus."); return; }
  if (ed.modules.includes(name)) { alert(`Le module ${name} existe déjà.`); return; }
  const d = await (await api("/api/module/skeleton?name=" + encodeURIComponent(name))).json();
  Object.assign(ed, { name, text: d.text, saved: "", hash: "", create: true, issues: d.issues, msg: "nouveau module : enregistrer pour créer modules/" + name + "/" });
  renderEditor();
}

// Coloration d'une ligne YAML (clés, chaînes, nombres, variables ${...}, commentaires)
function hlLine(line) {
  let code = line, comment = "", q = "";
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (q) { if (c === q) q = ""; continue; }
    if (c === '"' || c === "'") q = c;
    else if (c === "#" && (i === 0 || /\s/.test(line[i - 1]))) { code = line.slice(0, i); comment = line.slice(i); break; }
  }
  const re = /(\$\{[^}]*\})|("(?:[^"\\]|\\.)*"|'[^']*')|([A-Za-z0-9_.-]+)(?=\s*:(?:\s|$))|((?<=(?:^|:\s|[\[{,]|^\s*-\s)\s*)(?:-?\d+(?:\.\d+)?|true|false|null)(?=\s*(?:$|[,\]}])))|([{}\[\],]|^\s*-(?=\s))/g;
  let out = "", last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    const cls = m[1] ? "y-v" : m[2] ? "y-s" : m[3] ? "y-k" : m[4] ? "y-n" : "y-p";
    // une variable dans une chaîne reste visible
    out += m[2] ? `<span class="y-s">${esc(m[2]).replace(/\$\{[^}]*\}/g, v => `<span class="y-v">${v}</span>`)}</span>` : `<span class="${cls}">${esc(m[0])}</span>`;
    last = re.lastIndex;
    if (m[0] === "") re.lastIndex++;
  }
  out += esc(code.slice(last));
  if (comment) out += `<span class="y-c">${esc(comment)}</span>`;
  return out;
}

function lineLevels() {
  const lv = {};
  for (const i of ed.issues) if (i.line > 0) lv[i.line] = i.error ? "e" : (lv[i.line] || "w");
  return lv;
}

function paintEditor() {
  const ta = $("#ed-text");
  if (!ta) return;
  const lines = ed.text.split("\n"), lv = lineLevels();
  const cur = ed.text.slice(0, ta.selectionStart).split("\n").length;
  $("#ed-hl").innerHTML = lines.map((l, i) => `<span class="ln ${lv[i + 1] || ""} ${i + 1 === cur ? "cur" : ""}">${hlLine(l) || " "}</span>`).join("") + `<span class="ln"> </span>`;
  $("#ed-gutter").innerHTML = lines.map((_, i) => `<div class="${lv[i + 1] || ""}">${i + 1}</div>`).join("") + "<div></div>";
  syncScroll();
  const errs = ed.issues.filter(i => i.error).length, warns = ed.issues.length - errs;
  $("#ed-issues").innerHTML = ed.issues.length
    ? ed.issues.map(i => `<li class="${i.error ? "e" : "w"}" data-goto="${i.line || 0}"><span class="lvl">${i.error ? "erreur" : "avert."}</span>
        <span class="meta mono">${i.line ? "ligne " + i.line : ""}${i.path ? " " + esc(i.path) : ""}</span><span>${esc(i.msg)}</span></li>`).join("")
    : `<li class="ok">Aucun problème : le module est valide.</li>`;
  const st = $("#ed-state");
  st.innerHTML = (errs ? `<span class="err">${errs} erreur(s)</span>` : `<span class="pill on">valide</span>`) +
    (warns ? ` <span class="warn">${warns} avertissement(s)</span>` : "") +
    (dirty() ? ` · <strong>modifié</strong>` : ed.create ? "" : ` · enregistré`) + (ed.msg ? ` · <span class="meta">${esc(ed.msg)}</span>` : "");
  $("#ed-save").disabled = running || !!errs || !dirty();
  $("#ed-revert").disabled = running || ed.create;
  $("#ed-apply").disabled = running || dirty() || ed.create || !!errs;
}

function syncScroll() {
  const ta = $("#ed-text");
  $("#ed-hl").scrollTop = ta.scrollTop; $("#ed-hl").scrollLeft = ta.scrollLeft;
  $("#ed-gutter").scrollTop = ta.scrollTop;
}

function renderEditor() {
  const opts = ed.modules.map(n => `<option ${n === ed.name ? "selected" : ""}>${esc(n)}</option>`).join("") +
    (ed.create ? `<option selected>${esc(ed.name)} (nouveau)</option>` : "");
  $("#view-editor").innerHTML = `<section class="card">
    <div class="ed-bar">
      <select id="ed-module" ${ed.create ? "disabled" : ""}>${opts}</select>
      <span class="meta mono">modules/${esc(ed.name)}/module.yaml</span>
      <span class="spacer"></span>
      <span id="ed-state" class="state"></span>
    </div>
    <div class="editor">
      <div class="gutter" id="ed-gutter"></div>
      <div class="area"><pre id="ed-hl" aria-hidden="true"></pre><textarea id="ed-text" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea></div>
    </div>
    <ul class="issues" id="ed-issues"></ul>
    <div class="ed-bar" style="border-top:1px solid var(--line);border-bottom:0">
      <button id="ed-save" class="primary" title="Ctrl+S">${ed.create ? "Créer le module" : "Enregistrer"}</button>
      <button id="ed-revert" title="Abandonne les modifications et relit le fichier">Recharger le fichier</button>
      <button id="ed-apply" title="labctl ${esc(ed.name)} up">Appliquer (up)</button>
      <span class="spacer"></span>
      <button id="ed-new">Nouveau module…</button>
      <a class="meta" href="#" id="ed-help">Clés : docs/module-yaml.md</a>
    </div>
  </section>`;
  const ta = $("#ed-text");
  if (!ed.name) { $("#view-editor .editor").innerHTML = `<div class="empty">Aucun module déclaratif : « Nouveau module… »</div>`; }
  else { ta.value = ed.text; }
  paintEditor();
}

function scheduleCheck() {
  clearTimeout(ed.timer);
  ed.timer = setTimeout(async () => {
    const seq = ++ed.seq;
    try {
      const d = await (await api("/api/module/check", { method: "POST", body: JSON.stringify({ name: ed.name, text: ed.text }) })).json();
      if (seq === ed.seq) { ed.issues = d.issues; paintEditor(); }
    } catch (e) { ed.msg = e.message; paintEditor(); }
  }, 350);
}

async function saveModule() {
  if (!dirty() || ed.issues.some(i => i.error)) return;
  const r = await fetch("/api/module/save", { method: "POST", headers: { "X-Lab-Token": token, "Content-Type": "application/json" },
    body: JSON.stringify({ name: ed.name, text: ed.text, hash: ed.hash, create: ed.create }) });
  const d = await r.json().catch(() => ({ error: r.statusText }));
  if (!r.ok) {
    if (d.issues) ed.issues = d.issues;
    ed.msg = d.error || "erreur";
    paintEditor();
    if (r.status === 409) alert(d.error);
    return;
  }
  const created = ed.create;
  Object.assign(ed, { saved: ed.text.endsWith("\n") ? ed.text : ed.text + "\n", hash: d.hash, issues: d.issues, create: false,
    msg: created ? "module créé : « Appliquer » pour le construire" : "" });
  if (!ed.text.endsWith("\n")) ed.text += "\n";
  if (created) { ed.modules.push(ed.name); renderEditor(); } else paintEditor();
  load(true); loadConfig();
}

// Un « up » peut réécrire le fichier (sous-réseau, MAC) : on le relit ensuite
async function applyModule() {
  const name = ed.name;
  await run([name, "up"], `Construire le module ${name} (labctl ${name} up) : réseau, CA, VMs manquantes ? Les VMs existantes ne sont pas recréées.`);
  const saved = ed.saved;
  ed.saved = ed.text; // pas de question « abandonner » : rien n'est modifié
  if (!(await loadModuleText(name))) ed.saved = saved;
  else { ed.msg = ed.text !== saved ? "fichier complété par up (sous-réseau, MAC)" : ""; }
  renderEditor();
}

document.addEventListener("input", e => {
  if (e.target.id !== "ed-text") return;
  ed.text = e.target.value; ed.msg = "";
  paintEditor(); scheduleCheck();
});
document.addEventListener("scroll", e => { if (e.target.id === "ed-text") syncScroll(); }, true);
document.addEventListener("selectionchange", () => { if (document.activeElement?.id === "ed-text") paintEditor(); });
document.addEventListener("change", async e => {
  if (e.target.id !== "ed-module") return;
  const want = e.target.value;
  if (await loadModuleText(want)) renderEditor(); else e.target.value = ed.name;
});
document.addEventListener("keydown", e => {
  const ta = e.target;
  if (ta.id !== "ed-text") return;
  if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); saveModule(); return; }
  if (e.key === "Tab" && !e.shiftKey) { e.preventDefault(); document.execCommand("insertText", false, "  "); return; }
  if (e.key === "Enter") { // garde l'indentation de la ligne courante (et l'augmente après « clé: »)
    const before = ta.value.slice(0, ta.selectionStart), line = before.slice(before.lastIndexOf("\n") + 1);
    let ind = line.match(/^\s*(- )?/)[0].replace("- ", "  ");
    if (/:\s*$/.test(line)) ind += "  ";
    e.preventDefault(); document.execCommand("insertText", false, "\n" + ind);
  }
});
document.addEventListener("click", e => {
  const t = e.target.closest("[data-goto], #ed-save, #ed-revert, #ed-apply, #ed-new, #ed-help, [data-edit-module]");
  if (!t) return;
  if (t.dataset.editModule) { ed.want = t.dataset.editModule; showTab("editor"); }
  else if (t.id === "ed-save") saveModule();
  else if (t.id === "ed-revert") reloadModule();
  else if (t.id === "ed-apply") applyModule();
  else if (t.id === "ed-new") newModule();
  else if (t.id === "ed-help") { e.preventDefault(); alert("Référence complète des clés : docs/module-yaml.md (dans le dépôt Labs).\n\nVariables : ${module.name} ${module.domain} ${network.subnet} ${network.gateway} ${vm.name} ${vm.ip} ${vm.fqdn} ${vms.<vm>.ip} ${vms.<vm>.fqdn} ${keyboard}"); }
  else if (t.dataset.goto !== undefined) {
    const n = +t.dataset.goto, ta = $("#ed-text");
    if (!n || !ta) return;
    const lines = ed.text.split("\n"), start = lines.slice(0, n - 1).join("\n").length + (n > 1 ? 1 : 0);
    ta.focus(); ta.setSelectionRange(start, start + (lines[n - 1] || "").length);
    ta.scrollTop = Math.max(0, (n - 5) * parseFloat(getComputedStyle($(".editor")).getPropertyValue("--lh")));
    syncScroll(); paintEditor();
  }
});

// --- Actions (délégation d'événements)
document.addEventListener("click", e => {
  const t = e.target.closest("button, input[type=checkbox]");
  if (!t) return;
  if (t.dataset.tab) showTab(t.dataset.tab);
  else if (t.dataset.download) download(t.dataset.download);
  else if (t.dataset.cfg) { e.preventDefault(); editConfig(JSON.parse(t.dataset.cfg)); }
  else if (t.dataset.toggleDiff !== undefined) { showDiff = !showDiff; renderConfig(); }
  else if (t.dataset.rotateRoot !== undefined) {
    const word = prompt("Régénérer TOUTE la chaîne : nouvelle racine, toutes les CA, tous les certificats (nouvelles clés).\n" +
      "Les VMs ne feront plus confiance aux certificats tant qu'elles n'auront pas la nouvelle racine.\n" +
      "L'ancienne PKI est archivée.\n\nTaper RACINE pour confirmer :");
    if (word === "RACINE") run(["pki", "renew", "root", "--yes", ...($("#rotate-trust")?.checked ? ["--trust-vms"] : [])]);
    else if (word !== null) alert("Confirmation incorrecte : rien n'a été modifié.");
  }
  else if (t.dataset.run) run(JSON.parse(t.dataset.run), t.dataset.confirm);
  else if (t.dataset.console) console_(t.dataset.console);
  else if (t.dataset.snapshot) {
    const [m, vm] = JSON.parse(t.dataset.snapshot);
    const name = prompt(`Nom du snapshot de ${vm} (un snapshot existant du même nom est remplacé) :`, "clean");
    if (name && /^[A-Za-z0-9._-]+$/.test(name)) run([m, "snapshot", vm, name]);
    else if (name) alert("Nom invalide : lettres, chiffres, . _ - uniquement");
  } else if (t.dataset.restore) {
    const [m, vm, snaps] = JSON.parse(t.dataset.restore);
    const name = snaps.length === 1 ? snaps[0] : prompt(`Snapshot à restaurer pour ${vm} (${snaps.join(", ")}) :`, snaps[0]);
    if (name && snaps.includes(name)) run([m, "restore", vm, name], `Restaurer ${vm} au snapshot « ${name} » ? L'état actuel de la VM sera perdu.`);
  } else if (t.dataset.link) {
    e.preventDefault();
    const [op, a, b] = JSON.parse(t.dataset.link);
    run(["core", op, a, b], op === "link" ? `Autoriser ${a} à joindre et résoudre ${b} ?` : `Retirer le lien ${a} → ${b} ?`);
  } else if (t.dataset.cmdRun) {
    const input = $(`[data-cmd="${CSS.escape(t.dataset.cmdRun)}"]`);
    const words = input.value.trim().split(/\s+/).filter(Boolean);
    if (!words.length) return;
    const destructive = words[0] === "destroy";
    run([t.dataset.cmdRun, ...words], destructive ? `« ${words.join(" ")} » supprime définitivement des VMs. Continuer ?` : null)
      .then(() => { input.value = ""; });
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.dataset?.cmd) $(`[data-cmd-run="${CSS.escape(e.target.dataset.cmd)}"]`).click();
});
$("#refresh").onclick = () => load(true);
$("#log-toggle").onclick = () => { const l = $("#log"); l.classList.toggle("collapsed"); $("#log-toggle").textContent = l.classList.contains("collapsed") ? "Afficher" : "Masquer"; };
$("#log-clear").onclick = () => { $("#log-out").textContent = ""; };

if (!token) $("#main").innerHTML = `<div class="empty err">Jeton absent : ouvre l'adresse complète affichée par « labctl gui ».</div>`;
else {
  load(true); showTab(tab);
  setInterval(() => {
    if (running || document.hidden) return;
    load();
    if (tab === "core") loadCore();
  }, 5000);
  loadConfig(); // compteur de modifications en attente dans l'onglet
}
</script>
</body>
</html>
