<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labs</title>
<style>
:root {
  --bg: #f5f6f8; --panel: #ffffff; --text: #1d2330; --muted: #667085; --line: #e3e6eb;
  --accent: #2f6fde; --ok: #1e9e5a; --warn: #c98a12; --bad: #d1433b; --off: #98a2b3;
  --chip: #eef2f8; --log: #0f141c; --logtext: #d4dae3;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11151c; --panel: #181e27; --text: #e4e8ee; --muted: #8b95a5; --line: #283140;
    --accent: #5b93f0; --ok: #3cc47c; --warn: #e0a83a; --bad: #ef6b63; --off: #5d6878;
    --chip: #222a36; --log: #0a0e14; --logtext: #c9d1dc;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
header h1 { font-size: 18px; margin: 0; }
.spacer { flex: 1; }
main { padding: 20px 24px 280px; display: grid; gap: 18px; align-content: start; max-width: 1200px; width: 100%; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.card-head h2 { font-size: 16px; margin: 0; }
.meta { color: var(--muted); font-size: 13px; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 9px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; background: var(--off); vertical-align: middle; }
.dot.running { background: var(--ok); } .dot.paused { background: var(--warn); } .dot.absente { background: transparent; border: 1px solid var(--off); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--chip); font-size: 12px; white-space: nowrap; }
.pill.open { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); font-weight: 600; }
.pill.never { color: var(--bad); }
.pill.on { color: var(--ok); }
button, select, input { font: inherit; color: inherit; }
button { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 5px 11px; cursor: pointer; white-space: nowrap; }
button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover:not(:disabled) { color: #fff; filter: brightness(1.08); }
button.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
select, input { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 5px 8px; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.links { padding: 14px 16px; overflow-x: auto; }
.links table td, .links table th { text-align: center; padding: 8px 12px; }
.links table th:first-child, .links table td:first-child { text-align: left; }
.empty { padding: 18px 16px; color: var(--muted); }
#log { position: fixed; left: 0; right: 0; bottom: 0; height: 240px; background: var(--log); color: var(--logtext); display: flex; flex-direction: column; border-top: 1px solid var(--line); z-index: 3; }
#log.collapsed { height: 38px; }
#log .bar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; font-size: 13px; border-bottom: 1px solid #1f2733; }
#log .bar button { background: transparent; color: var(--logtext); border-color: #2c3645; padding: 2px 9px; }
#log pre { margin: 0; padding: 10px 16px; overflow: auto; flex: 1; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
#log.collapsed pre { display: none; }
.busy { color: var(--warn); }
.err { color: var(--bad); }
nav.tabs { display: flex; gap: 4px; }
nav.tabs button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; color: var(--muted); }
nav.tabs button.active { background: var(--chip); color: var(--text); font-weight: 600; }
.view { display: grid; gap: 18px; }
.view[hidden] { display: none; }
form.inline { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; padding: 14px 16px; }
form.inline label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
form.inline label.check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; padding: 14px 16px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.dot.active, .dot.ok { background: var(--ok); } .dot.failed { background: var(--bad); }
.warn { color: var(--warn); }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 16px; border-radius: 10px;
  border: 1px solid color-mix(in srgb, var(--warn) 50%, transparent); background: color-mix(in srgb, var(--warn) 12%, var(--panel)); }
.banner.ok { border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: color-mix(in srgb, var(--ok) 10%, var(--panel)); }
.diff { margin: 0; padding: 10px 16px; overflow-x: auto; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; border-top: 1px solid var(--line); }
.diff .add { color: var(--ok); } .diff .del { color: var(--bad); } .diff .skip { color: var(--muted); }
nav.tabs .count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--warn); color: #fff; font-size: 11px; }
/* Éditeur de module.yaml : texte transparent au-dessus d'une copie colorée */
.ed-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.ed-bar .state { font-size: 13px; }
.editor { --lh: 20px; position: relative; display: grid; grid-template-columns: max-content 1fr; height: min(62vh, 640px);
  font: 13px/var(--lh) ui-monospace, SFMono-Regular, Menlo, monospace; tab-size: 2; }
.editor .gutter { overflow: hidden; padding: 10px 0; background: var(--chip); color: var(--muted); text-align: right; user-select: none; border-right: 1px solid var(--line); }
.editor .gutter div { padding: 0 10px 0 14px; height: var(--lh); }
.editor .gutter .e { color: #fff; background: var(--bad); } .editor .gutter .w { color: #fff; background: var(--warn); }
.editor .area { position: relative; overflow: hidden; }
.editor pre, .editor textarea { position: absolute; inset: 0; margin: 0; padding: 10px 14px; border: 0; font: inherit; line-height: var(--lh);
  white-space: pre; overflow: auto; tab-size: 2; letter-spacing: normal; word-spacing: normal; }
.editor pre { pointer-events: none; color: var(--text); overflow: hidden; }
.editor textarea { background: transparent; color: transparent; caret-color: var(--text); resize: none; outline: none; }
.editor textarea::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); color: transparent; }
.editor .ln { display: block; height: var(--lh); }
.editor .ln.e { background: color-mix(in srgb, var(--bad) 14%, transparent); } .editor .ln.w { background: color-mix(in srgb, var(--warn) 12%, transparent); }
.editor .ln.cur { box-shadow: inset 3px 0 0 var(--accent); }
.y-k { color: var(--accent); } .y-s { color: var(--ok); } .y-n { color: #b45bd6; } .y-c { color: var(--muted); font-style: italic; }
.y-v { color: var(--warn); font-weight: 600; } .y-p { color: var(--muted); }
.issues { list-style: none; margin: 0; padding: 6px 0; border-top: 1px solid var(--line); max-height: 180px; overflow: auto; }
.issues li { display: flex; gap: 10px; padding: 4px 16px; cursor: pointer; font-size: 13px; }
.issues li:hover { background: var(--chip); }
.issues .lvl { min-width: 64px; font-weight: 600; } .issues .e .lvl { color: var(--bad); } .issues .w .lvl { color: var(--warn); }
.issues .ok { color: var(--ok); cursor: default; }
/* Pastille de la passerelle dans l'en-tête : un indicateur, ses actions sont dans l'onglet Core */
button#gw { border: 0; background: var(--chip); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
button#gw.down { color: var(--bad); font-weight: 600; }
button#pending-pill { border: 0; cursor: pointer; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600;
  background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
/* Action en cours */
.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
  animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
.doing { color: var(--warn); font-size: 13px; white-space: nowrap; }
/* Notifications */
#toasts { position: fixed; right: 16px; bottom: 52px; display: grid; gap: 8px; z-index: 5; width: min(420px, calc(100vw - 32px)); }
.toast { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 9px; background: var(--panel); border: 1px solid var(--line);
  border-left: 4px solid var(--ok); box-shadow: 0 6px 20px rgb(0 0 0 / .18); font-size: 13px; }
.toast.err { border-left-color: var(--bad); color: var(--text); }
.toast .msg { flex: 1; overflow-wrap: anywhere; }
.toast button { padding: 2px 8px; font-size: 12px; }
/* Boîtes de dialogue */
dialog#dlg { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text); padding: 0; width: min(460px, calc(100vw - 32px)); }
dialog#dlg::backdrop { background: rgb(0 0 0 / .45); }
dialog#pending-dlg { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text); padding: 0; width: min(820px, calc(100vw - 32px)); max-height: calc(100vh - 64px); }
dialog#pending-dlg::backdrop { background: rgb(0 0 0 / .45); }
dialog#pending-dlg .diff { border-top: 1px solid var(--line); border-radius: 0; }
dialog#pending-dlg .pending-actions { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 16px; border-top: 1px solid var(--line); }
dialog#dlg form { display: grid; gap: 12px; padding: 18px 20px; }
dialog#dlg h3 { margin: 0; font-size: 16px; }
dialog#dlg p { margin: 0; white-space: pre-line; color: var(--muted); }
dialog#dlg input, dialog#dlg select { width: 100%; }
.dlg-actions { display: flex; flex-direction: row-reverse; gap: 8px; margin-top: 4px; }
button.danger-solid { background: var(--bad); border-color: var(--bad); color: #fff; }
button.danger-solid:hover:not(:disabled) { color: #fff; border-color: var(--bad); filter: brightness(1.08); }
.down-banner { border-color: color-mix(in srgb, var(--bad) 50%, transparent); background: color-mix(in srgb, var(--bad) 10%, var(--panel)); }
.card-desc { padding: 8px 16px; border-bottom: 1px solid var(--line); }
details.cmd summary { cursor: pointer; padding: 10px 16px; color: var(--muted); font-size: 13px; }
details.cmd[open] summary { padding-bottom: 0; }
.sep { width: 1px; align-self: stretch; background: var(--line); }
/* Panneau latéral et page de module */
.layout { display: grid; grid-template-columns: 210px minmax(0, 1fr); }
aside#side { position: sticky; top: var(--hdr, 57px); align-self: start; height: calc(100vh - var(--hdr, 57px) - 38px); overflow: auto;
  padding: 10px 8px 20px; border-right: 1px solid var(--line); background: var(--panel); }
#side .grp { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 16px 10px 6px; }
#side button { display: flex; align-items: center; width: 100%; border: 0; background: transparent; padding: 7px 10px; border-radius: 7px; text-align: left; }
#side button:hover:not(:disabled) { background: var(--chip); color: var(--text); }
#side button.active { background: var(--chip); font-weight: 600; }
#side .n { margin-left: auto; padding-left: 8px; color: var(--muted); font-size: 12px; font-weight: 400; }
#side button.add { color: var(--muted); }
.subtabs { display: flex; gap: 2px; padding: 0 10px; }
.subtabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; padding: 10px 12px; color: var(--muted); }
.subtabs button.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.subtabs button:hover:not(:disabled) { color: var(--text); border-color: transparent transparent var(--line); }
.subtabs button.active:hover { border-bottom-color: var(--accent); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--text); font-weight: 600; }
.linkbtn:hover:not(:disabled) { color: var(--accent); text-decoration: underline; }
.vmdots .dot { margin-right: 3px; }
#pending:empty { display: none; }
/* Onglet Fichiers */
#f-card.drop { outline: 2px dashed var(--accent); outline-offset: -6px; }
.ftree td:first-child { white-space: nowrap; }
.ftree .ico { display: inline-block; width: 18px; color: var(--muted); }
textarea.ftext { display: block; width: 100%; height: min(60vh, 600px); border: 0; border-top: 1px solid var(--line); border-radius: 0; resize: vertical;
  padding: 10px 14px; background: var(--panel); color: var(--text); font: 13px/20px ui-monospace, SFMono-Regular, Menlo, monospace; tab-size: 2; white-space: pre; outline: none; }
#view-overview td.mono { white-space: nowrap; }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  aside#side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  header, main { padding-left: 16px; padding-right: 16px; }
  th:nth-child(3), td:nth-child(3) { display: none; }
}
</style>
</head>
<body>
<header>
  <h1>Labs</h1>
  <span class="spacer"></span>
  <button id="gw" data-go="core" title="Passerelle core-gw : DHCP, DNS et Internet des modules (détails et actions : Passerelle)">passerelle…</button>
  <button id="pending-pill" title="Changements de configuration non appliqués sur la passerelle (cliquer pour le détail)" hidden></button>
  <span id="updated" class="meta"></span>
  <button id="refresh" title="Rafraîchir">↻</button>
</header>
<div class="layout">
<aside id="side"></aside>
<main>
  <div id="pending"></div>
  <div class="view" id="view-overview"><div class="empty">Chargement…</div></div>
  <div class="view" id="view-module" hidden>
    <section class="card" id="mod-head"></section>
    <div class="view" id="mod-vms"></div>
    <div class="view" id="view-editor"></div>
    <div class="view" id="mod-net"></div>
    <div class="view" id="mod-files"></div>
  </div>
  <div class="view" id="view-core" hidden><div class="empty">Chargement…</div></div>
  <div class="view" id="view-pki" hidden><div class="empty">Chargement…</div></div>
  <div class="view" id="view-traffic" hidden></div>
</main>
</div>

<section id="log" class="collapsed">
  <div class="bar">
    <strong>Journal</strong><span id="log-status" class="meta"></span>
    <span class="spacer"></span>
    <button id="log-clear">Effacer</button>
    <button id="log-toggle">Afficher</button>
  </div>
  <pre id="log-out"></pre>
</section>
<div id="toasts"></div>
<dialog id="dlg"></dialog>
<dialog id="pending-dlg"></dialog>

<script>
"use strict";
const token = new URLSearchParams(location.hash.slice(1)).get("t") || "";
// Nouvelle adresse (labctl gui relancé) collée dans un onglet déjà ouvert : seul le fragment change,
// le navigateur ne recharge pas ; on recharge pour prendre le nouveau jeton. Sinon, c'est une navigation (précédent…)
addEventListener("hashchange", () => {
  const h = new URLSearchParams(location.hash.slice(1));
  if ((h.get("t") || "") !== token) location.reload(); else if (h.get("p") !== page) go(h.get("p"));
});
const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let state = null, running = false, current = null, core = null, pki = null, config = null;
const stateLabel = { running: "démarrée", "shut off": "arrêtée", paused: "en pause", absente: "absente", crashed: "plantée", pmsuspended: "suspendue", "in shutdown": "en arrêt" };
const stLabel = s => stateLabel[s] || s;

// Notification en bas à droite ; les erreurs restent jusqu'à fermeture
function toast(msg, err = false, withLog = false) {
  const t = document.createElement("div");
  t.className = "toast" + (err ? " err" : "");
  t.innerHTML = `<span>${err ? "✗" : "✓"}</span><span class="msg">${esc(msg)}</span>${withLog ? `<button data-show-log>Journal</button>` : ""}<button data-close aria-label="Fermer">×</button>`;
  t.addEventListener("click", e => {
    if (e.target.dataset.showLog !== undefined) openLog();
    if (e.target.closest("button")) t.remove();
  });
  $("#toasts").append(t);
  if (!err) setTimeout(() => t.remove(), 6000);
}

// Boîte de dialogue : confirmation (true), saisie ou choix (valeur), annulation (null)
function ask({ title, text = "", ok = "Confirmer", danger = false, input = false, options = null, value = "", pattern = "", hint = "", cancel = true }) {
  const d = $("#dlg");
  const field = options
    ? `<select name="v">${options.map(x => `<option ${x === value ? "selected" : ""}>${esc(x)}</option>`).join("")}</select>`
    : input ? `<input name="v" value="${esc(value)}" required autocomplete="off" spellcheck="false" ${pattern ? `pattern="${esc(pattern)}" title="${esc(hint)}"` : ""}>` : "";
  // Bouton de validation en premier : c'est lui qu'Entrée déclenche (l'ordre affiché est inversé en CSS)
  d.innerHTML = `<form method="dialog"><h3>${esc(title)}</h3>${text ? `<p>${esc(text)}</p>` : ""}${field}
    <div class="dlg-actions"><button value="ok" class="${danger ? "danger-solid" : "primary"}">${esc(ok)}</button>
    ${cancel ? `<button value="" formnovalidate>Annuler</button>` : ""}</div></form>`;
  return new Promise(res => {
    // Réponse à la validation du formulaire (immédiate), sinon à la fermeture (Échap) ; une seule fois
    let done = false;
    const finish = ok => {
      if (done) return;
      done = true;
      const f = d.querySelector("[name=v]");
      res(ok ? (f ? f.value.trim() : true) : null);
    };
    d.querySelector("form").addEventListener("submit", e => finish(e.submitter?.value === "ok"));
    d.onclose = () => finish(d.returnValue === "ok");
    d.returnValue = "";
    d.showModal();
    const f = d.querySelector("[name=v]");
    if (f) { f.focus(); f.select?.(); } else d.querySelector("button[value=ok]").focus();
  });
}

function openLog() { $("#log").classList.remove("collapsed"); $("#log-toggle").textContent = "Masquer"; }
// Page affichée : overview, core, pki, new (brouillon de nouveau module), m/<module>/<vms|yaml|files|net>.
// Elle est dans l'adresse (#t=…&p=…) : un rechargement ou le bouton précédent y ramènent.
let page = "overview";
const modPage = () => page.startsWith("m/") ? page.split("/").slice(1) : [page === "new" ? ed.name : "", page === "new" ? "yaml" : ""];
const openCmd = new Set(); // champs « autre commande » dépliés (le rendu toutes les 5 s ne doit pas les refermer)
document.addEventListener("toggle", e => {
  const d = e.target.closest?.("details[data-cmd-box]");
  if (d) d.open ? openCmd.add(d.dataset.cmdBox) : openCmd.delete(d.dataset.cmdBox);
}, true);

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "X-Lab-Token": token, "Content-Type": "application/json", ...(opts.headers || {}) } });
  if (!r.ok) throw new Error((await r.text()).trim() || r.statusText);
  return r;
}

function go(p) {
  p = p || "overview";
  const [kind, name, sub] = p.split("/");
  if (kind === "m") p = name ? `m/${name}/${["vms", "yaml", "files", "net"].includes(sub) ? sub : "vms"}` : "overview";
  else if (!["overview", "core", "pki", "traffic", "new"].includes(p) || (p === "new" && !ed.create)) p = "overview";
  const changed = p !== page;
  page = p;
  if (location.hash !== `#t=${token}&p=${p}`) history[changed ? "pushState" : "replaceState"](null, "", `#t=${token}&p=${p}`);
  try { localStorage.setItem("labs-page", p); } catch {}
  const [m, s] = modPage();
  $("#view-overview").hidden = p !== "overview";
  $("#view-core").hidden = p !== "core";
  $("#view-pki").hidden = p !== "pki";
  $("#view-traffic").hidden = p !== "traffic";
  $("#view-module").hidden = !m;
  $("#mod-vms").hidden = s !== "vms";
  $("#view-editor").hidden = s !== "yaml";
  $("#mod-net").hidden = s !== "net";
  $("#mod-files").hidden = s !== "files";
  render(); renderNet();
  if (changed) scrollTo(0, 0);
  if (p === "core") loadCore(); else if (p === "pki") loadPKI(); else if (p === "traffic") loadTraffic();
  else if (s === "yaml" && p !== "new") { ed.want = m; openEditor(); }
  else if (s === "net") loadConfig();
  else if (s === "files") loadFiles(m);
}

async function loadConfig() {
  try { config = await (await api("/api/config")).json(); renderPending(); renderNet(); render(); }
  catch (e) { $("#pending").innerHTML = `<div class="banner"><span class="err">${esc(e.message)}</span></div>`; }
}

async function editConfig(body) {
  try { await api("/api/config", { method: "POST", body: JSON.stringify(body) }); await loadConfig(); return true; }
  catch (e) { toast(e.message, true); return false; }
}

const lastOctet = ip => { const m = /(\d+)\s*$/.exec(ip || ""); return m ? parseInt(m[1], 10) : 0; };

// Débrancher une VM externe (câblage local) : retire la carte et l'entrée de attach.local.yaml.
async function detachVM({ module, vm, name }) {
  if (!await ask({ title: "Débrancher", text: `Retirer ${vm} du réseau de ${module} ?`, ok: "Débrancher", danger: true })) return;
  if (await editConfig({ op: "attach-del", module, target: vm })) { toast(`${name} débranchée de ${module}`); load(true); }
}

// Brancher une VM d'un autre module : choisir la VM (à IP fixe), puis une adresse libre sur ce réseau.
async function attachPicker(on) {
  const host = (state.modules || []).find(m => m.name === on);
  if (!host) return;
  const already = new Set((host.attached || []).map(a => a.from));
  const cands = [];
  for (const m of state.modules || []) {
    if (m.name === on) continue;
    for (const v of m.vms || []) {
      const ref = `${m.name}/${v.name}`;
      if (/\.\d+$/.test(v.ip || "") && !already.has(ref)) cands.push(ref);
    }
  }
  if (!cands.length) { toast("Aucune VM à IP fixe à brancher (les autres modules n'en déclarent pas, ou elles sont déjà branchées)"); return; }
  const ref = await ask({ title: `Brancher sur ${on}`, text: "Choisir la VM à brancher sur ce réseau :", options: cands, ok: "Suivant" });
  if (!ref) return;
  const used = new Set();
  for (const v of host.vms || []) used.add(lastOctet(v.ip));
  for (const a of host.attached || []) used.add(lastOctet(a.ip));
  let free = 50; while (free <= 99 && used.has(free)) free++;
  const s = await ask({ title: `Adresse de ${ref}`, text: `Dernier octet (2 à 99) sur ${host.subnet}.x :`, input: true, value: String(free), pattern: "[0-9]{1,3}", hint: "un nombre entre 2 et 99", ok: "Brancher" });
  if (!s) return;
  const octet = parseInt(s, 10);
  if (!(octet >= 2 && octet <= 99)) { toast("Adresse hors plage (2 à 99)", true); return; }
  if (await editConfig({ op: "attach-add", module: on, target: ref, octet })) { toast(`${ref} branchée sur ${on}`); load(true); }
}

async function loadCore(fresh = false) {
  try { core = await (await api("/api/core" + (fresh ? "?fresh" : ""))).json(); renderCore(); }
  catch (e) { $("#view-core").innerHTML = `<div class="empty err">${esc(e.message)}</div>`; }
}

async function loadPKI() {
  try { pki = await (await api("/api/pki")).json(); renderPKI(); }
  catch (e) { $("#view-pki").innerHTML = `<div class="empty err">${esc(e.message)}</div>`; }
}

async function download(path) {
  try {
    const blob = await (await api("/api/pki/file?path=" + encodeURIComponent(path))).blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = path.split("/").pop();
    document.body.append(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
  } catch (e) { toast(e.message, true); }
}

async function load(fresh = false) {
  try {
    state = await (await api("/api/state" + (fresh ? "?fresh" : ""))).json();
    render();
    $("#updated").textContent = "à jour à " + new Date().toLocaleTimeString("fr-FR");
  } catch (e) {
    $("#updated").innerHTML = `<span class="err">${esc(e.message)}</span>`;
  }
}

// --- Exécution d'une commande labctl, sortie affichée au fil de l'eau
// confirmText : question posée avant (danger : bouton rouge). Le journal n'est pas ouvert d'office : l'action
// en cours s'affiche à sa place (ligne de la VM, module), et une notification donne le résultat.
async function run(args, confirmText, danger = false) {
  if (running) return false;
  if (confirmText && !(await ask({ title: "Confirmer", text: confirmText, ok: danger ? "Oui, continuer" : "Continuer", danger }))) return false;
  running = true; current = args; render(); paintEditor();
  const log = $("#log-out");
  const shown = `labctl ${args.join(" ")}`;
  $("#log-status").innerHTML = `<span class="busy"><span class="spin"></span>${esc(shown)}</span>`;
  log.textContent += `\n$ ${shown}\n`;
  let out = "", ok = false;
  try {
    const r = await api("/api/run", { method: "POST", body: JSON.stringify({ args }) });
    const reader = r.body.getReader(), dec = new TextDecoder();
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      // Retire les codes couleur ANSI
      const chunk = dec.decode(value, { stream: true }).replace(/\x1b\[[0-9;]*m/g, "");
      out += chunk; log.textContent += chunk;
      log.scrollTop = log.scrollHeight;
    }
    ok = out.trimEnd().endsWith("[terminé]");
    $("#log-status").textContent = "";
  } catch (e) {
    out += e.message;
    log.textContent += `[erreur : ${e.message}]\n`;
    $("#log-status").innerHTML = `<span class="err">${esc(e.message)}</span>`;
  } finally {
    running = false; current = null; log.scrollTop = log.scrollHeight;
    if (ok) toast(`${shown} : terminé`, false, true);
    else {
      // dernière ligne utile de la sortie, pour savoir tout de suite pourquoi
      const why = out.split("\n").map(l => l.trim()).filter(l => l && !l.startsWith("[échec")).pop() || "";
      toast(`${shown} : échec${why ? " — " + why : ""}`, true, true);
    }
    paintEditor();
    await load(true);
    if (page === "core") await loadCore(true);
    if (page === "pki") await loadPKI();
    await loadConfig(); // changements en attente sur la passerelle
  }
  return ok;
}

async function console_(vm) {
  try { await api("/api/console", { method: "POST", body: JSON.stringify({ vm }) }); }
  catch (e) { toast(e.message, true); }
}

// L'action en cours concerne-t-elle ce module (et cette VM) ? Réponse : son verbe, sinon ""
const verbLabel = { up: "construction", start: "démarrage", stop: "arrêt", snapshot: "snapshot", restore: "restauration", certs: "certificats",
  destroy: "suppression", keyboard: "clavier", on: "ouverture d'Internet", off: "fermeture d'Internet" };
function activeOn(m, vm, wideOnly = false) {
  const a = current;
  if (!a) return "";
  let mod, vms, verb;
  if (a[0] === "core" && a[1] === "internet") [verb, mod, vms] = [a[2], a[3], a.slice(4)];
  else [mod, verb, vms] = [a[0], a[1], a.slice(2)];
  if (mod !== m || (vm && vms.length && !vms.includes(vm)) || (wideOnly && vms.length)) return "";
  return verbLabel[verb] || verb || "commande";
}
const doing = v => `<span class="doing"><span class="spin"></span>${esc(v)} en cours…</span>`;

// --- Rendu
const has = (m, c) => (m.commands || []).includes(c);
const runAttr = args => `data-run='${esc(JSON.stringify(args))}'`;
const vmCount = m => { const vms = m.vms || []; return [vms.filter(v => v.state === "running").length, vms.length]; };

// Actions qui portent sur tout le module (vue d'ensemble et page du module)
function moduleActions(m, busy) {
  const vms = m.vms || [], wide = activeOn(m.name, "", true);
  if (wide) return doing(wide);
  const anyUp = vms.some(v => v.state === "running"), anyDown = vms.some(v => v.state !== "running" && v.state !== "absente");
  const anyMissing = vms.some(v => v.state === "absente");
  return `<span class="actions">
    ${has(m, "start") && anyDown ? `<button ${busy} ${runAttr([m.name, "start"])}>Tout démarrer</button>` : ""}
    ${has(m, "stop") && anyUp ? `<button ${busy} ${runAttr([m.name, "stop"])} data-confirm="Arrêter toutes les VMs du module ${esc(m.name)} ?">Tout arrêter</button>` : ""}
    ${has(m, "up") ? `<button ${busy} class="${anyMissing ? "primary" : ""}" ${runAttr([m.name, "up"])}
        data-confirm="${anyMissing ? `Construire le module ${esc(m.name)} : réseau, CA et VMs manquantes (les VMs existantes ne sont pas recréées).` : `Mettre à jour le module ${esc(m.name)} : réconcilie réseau, CA, certificats et cartes branchées avec le module.yaml.`}"
        title="labctl ${esc(m.name)} up : crée ce qui manque, réconcilie le reste">${anyMissing ? "Construire" : "Mettre à jour"}</button>` : ""}
  </span>`;
}

function render() {
  if (!state) return;
  const gwUp = state.gateway.state === "running";
  $("#gw").className = gwUp ? "" : "down";
  $("#gw").innerHTML = `<span class="dot ${gwUp ? "running" : ""}"></span>passerelle ${esc(stLabel(state.gateway.state))}`;
  const mods = state.modules || [];
  const busy = running ? "disabled" : "";
  const [cur, sub] = modPage();

  // Panneau latéral
  const nav = (p, label, extra = "") => `<button data-go="${esc(p)}" class="${page === p || (p.startsWith("m/") && cur && p.startsWith(`m/${cur}/`) && page !== "new") ? "active" : ""}">${label}${extra}</button>`;
  $("#side").innerHTML = nav("overview", "Vue d'ensemble") +
    `<div class="grp">Modules</div>` +
    mods.map(m => {
      const [up, n] = vmCount(m);
      return nav(`m/${m.name}/vms`, `<span class="dot ${up ? "running" : ""}"></span>${esc(m.name)}`, `<span class="n">${activeOn(m.name) ? `<span class="spin"></span>` : ""}${up}/${n}</span>`);
    }).join("") +
    (ed.create ? `<button data-go="new" class="${page === "new" ? "active" : ""}"><span class="dot absente"></span>${esc(ed.name)}<span class="n">brouillon</span></button>` : "") +
    `<button class="add" data-new-module>+ Nouveau module…</button>` +
    `<div class="grp">Infrastructure</div>` +
    nav("core", `<span class="dot ${gwUp ? "running" : ""}"></span>Passerelle`) +
    nav("pki", "PKI") +
    nav("traffic", "Trafic (proxy)");

  // Sans passerelle, plus de DHCP, DNS ni Internet : on le dit en tête, avec de quoi la relancer
  const down = gwUp ? "" : `<div class="banner down-banner"><strong>Passerelle core-gw ${esc(stLabel(state.gateway.state))}</strong>
    <span class="meta">les modules n'ont plus de DHCP, de DNS ni d'Internet</span><span class="spacer"></span>
    ${state.gateway.state === "absente" ? `<button data-go="core">Page Passerelle</button>` : `<button class="primary" ${busy} data-run='["core","start"]'>Démarrer la passerelle</button>`}</div>`;

  if (page === "overview") renderOverview(mods, down, busy);
  if (cur) renderModule(mods.find(m => m.name === cur), cur, sub, down, gwUp, busy);
}

function renderOverview(mods, down, busy) {
  const links = [];
  for (const a of (config?.modules || [])) for (const b of a.links || []) {
    const back = (config.modules.find(x => x.name === b)?.links || []).includes(a.name);
    if (back && a.name > b) continue; // lien réciproque : une seule fois
    links.push(`<span class="pill mono">${esc(a.name)} ${back ? "↔" : "→"} ${esc(b)}</span>`);
  }
  $("#view-overview").innerHTML = down + `<section class="card">
    <div class="card-head"><h2>Modules</h2><span class="meta">${mods.length} module(s)</span><span class="spacer"></span>
      <button data-new-module title="Ouvre l'éditeur sur le squelette d'un nouveau module.yaml">Nouveau module…</button></div>
    <table><thead><tr><th>Module</th><th>Réseau</th><th>VMs</th><th>Internet</th><th>Actions</th></tr></thead><tbody>
    ${mods.map(m => {
      const [up, n] = vmCount(m);
      return `<tr><td><button class="linkbtn" data-go="m/${esc(m.name)}/vms">${esc(m.name)}</button><div class="meta">${esc(m.description)}</div></td>
        <td class="mono meta">${esc(m.subnet)}.0/24<div>${esc(m.domain)}</div>${m.netActive ? "" : `<span class="pill never">réseau inactif</span>`}</td>
        <td><span class="vmdots">${(m.vms || []).map(v => `<span class="dot ${esc(v.state.replace(" ", "-"))}" title="${esc(v.name)} : ${esc(stLabel(v.state))}"></span>`).join("")}</span>
          <span class="meta">${up}/${n}</span></td>
        <td><span class="pill ${m.internet !== "fermé" ? "open" : ""}">${esc(m.internet)}</span></td>
        <td>${moduleActions(m, busy)}</td></tr>`;
    }).join("") || `<tr><td colspan="5" class="empty">Aucun module : « Nouveau module… » pour en créer un.</td></tr>`}
    </tbody></table>
    <div class="card-head" style="border-top:1px solid var(--line);border-bottom:0">
      <span class="meta">Liens entre modules :</span>
      <span class="tags">${links.join("") || `<span class="meta">aucun (chaque module est isolé)</span>`}</span>
      <span class="meta">→ un sens, ↔ les deux ; à régler dans l'onglet Réseau de chaque module</span>
    </div>
  </section>`;
}

function renderModule(m, name, sub, down, gwUp, busy) {
  const dis = running || !gwUp ? "disabled" : "";
  const yamlMod = page === "new" || (m && has(m, "up"));
  const tabs = page === "new" ? [["yaml", "module.yaml"]]
    : [["vms", "VMs"], ...(yamlMod ? [["yaml", "module.yaml" + (ed.name === name && dirty() ? " ●" : "")],
        ["files", "Fichiers" + (fx.module === name && fdirty() ? " ●" : "")]] : []), ["net", "Réseau"]];
  let head;
  if (page === "new") head = `<div class="card-head"><h2>${esc(name)}</h2><span class="pill">nouveau module, pas encore enregistré</span></div>`;
  else if (!m) head = `<div class="card-head"><h2>${esc(name)}</h2><span class="err">module introuvable</span></div>`;
  else {
    const openAll = m.internetAll;
    head = `<div class="card-head">
        <h2>${esc(m.name)}</h2>
        <span class="meta mono">${esc(m.subnet)}.0/24 · ${esc(m.domain)}</span>
        ${m.netActive ? "" : `<span class="pill never">réseau ${esc(m.net)} inactif</span>`}
        <span class="spacer"></span>${moduleActions(m, busy)}
      </div>
      <div class="card-head" style="padding-top:8px;padding-bottom:8px">
        <span class="meta">${esc(m.description)}</span>
        <span class="spacer"></span>
        <span class="pill ${m.internet !== "fermé" ? "open" : ""}">Internet : ${esc(m.internet)}</span>
        <span class="actions">
          ${openAll
            ? `<button ${dis} ${runAttr(["core", "internet", "off", m.name])}>Fermer Internet</button>`
            : `<button ${dis} ${runAttr(["core", "internet", "on", m.name])} data-confirm="Ouvrir Internet à tout le module ${esc(m.name)} (sauf les VMs « jamais ») ?">Ouvrir à tout le module</button>
               ${m.internet !== "fermé" ? `<button ${dis} ${runAttr(["core", "internet", "off", m.name])}>Tout fermer</button>` : ""}`}
        </span>
      </div>`;
  }
  $("#mod-head").innerHTML = head + `<nav class="subtabs">${tabs.map(([k, l]) =>
    `<button data-go="${page === "new" ? "new" : `m/${esc(name)}/${k}`}" class="${sub === k ? "active" : ""}">${esc(l)}</button>`).join("")}</nav>`;
  if (sub !== "vms" || !m) { if (sub === "vms") $("#mod-vms").innerHTML = ""; return; }

  const vms = m.vms || [], wide = activeOn(m.name, "", true), openAll = m.internetAll;
  let html = (down ? down : "") + `<section class="card"><table>
    <thead><tr><th>VM</th><th>IP</th><th>Snapshots</th><th>Internet</th><th>Actions</th></tr></thead><tbody>`;
  for (const v of vms) {
    const up = v.state === "running", exists = v.state !== "absente";
    const snaps = v.snapshots || [];
    const act = wide ? "" : activeOn(m.name, v.name);
    let net;
    if (v.noInternet) net = `<span class="pill never" title="internet: never dans le module.yaml">jamais</span>`;
    else if (openAll) net = `<span class="pill open">ouvert (module)</span>`;
    else if (v.internet) net = `<span class="pill open">ouvert</span> <button ${dis} ${runAttr(["core", "internet", "off", m.name, v.name])}>Fermer</button>`;
    else net = `<span class="pill">fermé</span> <button ${dis} ${runAttr(["core", "internet", "on", m.name, v.name])}>Ouvrir</button>`;
    html += `<tr>
      <td><span class="dot ${esc(v.state.replace(" ", "-"))}"></span><strong>${esc(v.name)}</strong> <span class="meta">${esc(stLabel(v.state))}</span></td>
      <td class="mono">${esc(v.ip)}</td>
      <td class="meta">${snaps.length ? esc(snaps.join(", ")) : "—"}</td>
      <td>${net}</td>
      <td><div class="actions">${act ? doing(act) : !exists
        ? (has(m, "up") ? `<button ${busy} ${runAttr([m.name, "up", v.name])}>Créer</button>`
          : has(m, v.name) ? `<button ${busy} ${runAttr([m.name, v.name])}>Créer</button>` : `<span class="meta">absente</span>`)
        : `${has(m, "start") && !up ? `<button ${busy} ${runAttr([m.name, "start", v.name])}>Démarrer</button>` : ""}
           ${has(m, "stop") && up ? `<button ${busy} ${runAttr([m.name, "stop", v.name])}>Arrêter</button>` : ""}
           ${up ? `<button data-console="${esc(v.libvirt)}">Console</button>` : ""}
           ${has(m, "snapshot") ? `<button ${busy} data-snapshot='${esc(JSON.stringify([m.name, v.name]))}'>Snapshot</button>` : ""}
           ${has(m, "restore") && snaps.length ? `<button class="danger" ${busy} data-restore='${esc(JSON.stringify([m.name, v.name, snaps]))}'>Restaurer…</button>` : ""}
           ${has(m, "destroy") ? `<button class="danger" ${busy} ${runAttr([m.name, "destroy", v.name])} data-confirm="Supprimer ${esc(v.name)} : la VM, son disque et ses snapshots seront définitivement effacés. Irréversible.">Supprimer</button>` : ""}`}
      </div></td></tr>`;
  }
  if (!vms.length) html += `<tr><td colspan="5" class="empty">Aucune VM déclarée : onglet module.yaml</td></tr>`;
  // VMs d'autres modules branchées sur ce réseau (attach:) : la machine reste gérée dans son module
  html += `<tr class="sub"><td colspan="5" class="meta">VMs externes branchées sur ce réseau</td></tr>`;
  for (const a of m.attached || []) {
    const [owner] = a.from.split("/");
    const detach = a.local
      ? `<button class="danger" ${busy} data-detach='${esc(JSON.stringify({ module: m.name, vm: a.from, name: a.name }))}'>Débrancher</button>`
      : `<span class="meta" title="déclaré dans ${esc(owner)}/module.yaml (attach:)">dans le module.yaml</span>`;
    html += `<tr>
      <td><span class="dot ${esc(a.state.replace(" ", "-"))}"></span><strong>${esc(a.name)}</strong> <span class="meta">${esc(stLabel(a.state))}</span>
        <div class="meta">branchée depuis <button class="linkbtn" style="font-weight:400" data-go="m/${esc(owner)}/vms">${esc(a.from)}</button></div></td>
      <td class="mono">${esc(a.ip)}</td><td class="meta">—</td><td><span class="meta">via ${esc(owner)}</span></td>
      <td><div class="actions">${a.state === "absente" ? `<span class="meta">à créer dans ${esc(owner)}</span>`
        : a.plugged ? `<span class="pill on">carte branchée</span>`
        : `<button ${busy} ${runAttr([m.name, "up"])} title="labctl ${esc(m.name)} up : pose la carte de cette VM sur le réseau du module">Poser la carte</button>`} ${detach}</div></td></tr>`;
  }
  html += `<tr><td colspan="5"><button ${busy} data-attach-add="${esc(m.name)}">+ Brancher une VM d'un autre module…</button></td></tr>`;
  html += `</tbody></table>
    <details class="cmd" style="border-top:1px solid var(--line)" ${openCmd.has(m.name) ? "open" : ""} data-cmd-box="${esc(m.name)}">
      <summary>Autre commande du module (labctl ${esc(m.name)} …)</summary>
      <div class="card-head" style="border-bottom:0">
        <input class="mono" style="flex:1;min-width:200px" placeholder="ex. status  ·  certs  ·  snapshot msf2 avant-exploit" data-cmd="${esc(m.name)}">
        <button ${busy} data-cmd-run="${esc(m.name)}">Lancer</button>
      </div>
    </details></section>`;

  const focus = document.activeElement?.dataset?.cmd, val = focus ? document.activeElement.value : "";
  $("#mod-vms").innerHTML = html;
  if (focus) { const el = $(`[data-cmd="${CSS.escape(focus)}"]`); if (el) { el.value = val; el.focus(); } }
}

// --- Changements en attente sur la passerelle : bandeau en haut de toutes les pages
// Changements de la passerelle non appliqués : pilule compacte dans l'en-tête (cliquable), détail dans une
// modale. Seul le cas d'erreur garde une bannière rouge en haut du contenu.
function renderPending() {
  const c = config;
  if (!c) return;
  const pending = c.pending || [];
  const on = c.gateway === "running";
  $("#pending").innerHTML = (on && c.pendingError) ? `<div class="banner"><span class="err">${esc(c.pendingError)}</span></div>` : "";
  const pill = $("#pending-pill"), dlg = $("#pending-dlg");
  if (on && pending.length) {
    pill.hidden = false;
    pill.innerHTML = `⚠ ${pending.length} changement${pending.length > 1 ? "s" : ""} passerelle`;
    if (dlg.open) dlg.innerHTML = pendingModal(); // garder la modale à jour si elle est ouverte
  } else {
    pill.hidden = true;
    if (dlg.open) dlg.close();
  }
}

function pendingModal() {
  const pending = (config && config.pending) || [], busy = running ? "disabled" : "";
  return `<div class="card-head"><h3 style="margin:0;font-size:16px">Modifications non appliquées sur la passerelle</h3>
      <span class="spacer"></span><button data-close-pending aria-label="Fermer">×</button></div>
    <div class="card-desc meta">${pending.length} fichier(s) de configuration changeront. « Appliquer » régénère puis recharge le DHCP, le DNS et le pare-feu de la passerelle.</div>
    ${pending.map(f => `<pre class="diff"><strong>${esc(f.file)}</strong>\n${f.lines.map(l =>
      l.op === "…" ? `<span class="skip">  …</span>` : `<span class="${l.op === "+" ? "add" : l.op === "-" ? "del" : ""}">${esc(l.op)} ${esc(l.text)}</span>`).join("\n")}</pre>`).join("")}
    <div class="pending-actions">
      <button data-close-pending>Fermer</button>
      <button class="primary" ${busy} data-apply-pending>Appliquer sur la passerelle</button>
    </div>`;
}

function openPending() {
  const dlg = $("#pending-dlg");
  dlg.innerHTML = pendingModal();
  dlg.showModal();
}

// Connexions restreintes (connections: du module.yaml) : celles du module, et celles qui arrivent vers lui
function connCard(m, mods, busy) {
  const fixed = mod => (mods.find(x => x.name === mod)?.hosts || []).filter(x => x.ip).map(x => x.name).sort();
  const desc = c => `${(c.from || []).length ? esc(c.from.join(", ")) : `<span class="meta">tout le module</span>`}`;
  const ports = c => (c.ports || []).length ? `<div class="tags">${c.ports.map(p => `<span class="pill mono">${esc(p)}</span>`).join("")}</div>` : `<span class="meta">tous</span>`;
  const out = m.connections || [];
  const mode = c => c.via === "proxy" ? `<span class="pill open" title="${esc(JSON.stringify(c.proxy || {}))}">proxy : ${esc(c.proxy?.mode || "log")}${
      (c.proxy?.allow || []).length ? " (seuls " + esc(c.proxy.allow.join(", ")) + ")" : (c.proxy?.deny || []).length ? " (sauf " + esc(c.proxy.deny.join(", ")) + ")" : ""}</span>`
    : c.via !== "portal" ? `<span class="meta">direct</span>`
    : `<span class="pill open" title="${esc(JSON.stringify(c.portal || {}))}">portail : ${esc(c.portal?.auth || "click")}, ${esc(c.portal?.duration || "1h")}</span>`;
  const incoming = [];
  for (const o of mods) if (o.name !== m.name) (o.connections || []).forEach(c => {
    if (c.to === m.name || c.to.startsWith(m.name + "/")) incoming.push({ ...c, src: o.name });
  });
  const targets = [["internet", "Internet (quand il est ouvert)"]];
  for (const o of mods) if (o.name !== m.name) {
    targets.push([o.name, `${o.name} (tout le module)`]);
    for (const vm of fixed(o.name)) targets.push([`${o.name}/${vm}`, `${o.name} / ${vm}`]);
  }
  return `<section class="card"><div class="card-head"><h2>Connexions restreintes</h2>
      <span class="meta">ports précis, depuis certaines VMs, vers un module, une VM ou Internet ; un lien de la carte précédente, lui, ouvre tout</span></div>
    <table><thead><tr><th>Vers</th><th>Depuis (${esc(m.name)})</th><th>Ports</th><th>Mode</th><th></th></tr></thead><tbody>
    ${out.map((c, i) => `<tr><td class="mono">${c.to === "internet" ? "Internet" : esc(c.to)}</td><td>${desc(c)}</td><td>${ports(c)}</td><td>${mode(c)}</td>
      <td><button class="danger" ${busy} data-cfg='${esc(JSON.stringify({ op: "conn-del", module: m.name, index: i }))}'>Retirer</button></td></tr>`).join("")
      || `<tr><td colspan="5" class="empty">Aucune</td></tr>`}
    </tbody></table>
    <form class="inline" data-cfg-form="conn" data-module="${esc(m.name)}" style="border-top:1px solid var(--line)">
      <strong style="width:100%">Ajouter une connexion</strong>
      <label>Vers<select name="target" required>${targets.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join("")}</select></label>
      <span style="display:grid;gap:3px;font-size:12px;color:var(--muted)">Depuis (aucune case : tout le module)<span style="display:flex;flex-wrap:wrap;gap:4px 12px;padding-top:4px">
        ${fixed(m.name).map(n => `<label class="check"><input type="checkbox" name="from" value="${esc(n)}"> ${esc(n)}</label>`).join("") || `<span class="meta">aucune VM à IP fixe</span>`}</span></span>
      <label>Ports (vide : tous)<input name="ports" class="mono" placeholder="tcp/80 tcp/443 udp/53 icmp" style="min-width:240px"></label>
      <label>Mode<select name="via" data-via><option value="direct">direct</option><option value="portal">derrière un portail captif</option><option value="proxy">via le proxy</option></select></label>
      <div class="proxy-opts" hidden style="width:100%;display:flex;flex-wrap:wrap;gap:8px;align-items:end;padding:8px 0;border-top:1px dashed var(--line)">
        <label>Mode du proxy<select name="pmode" data-pmode><option value="log">log : journal, HTTPS non déchiffré</option><option value="filter">filter : domaines autorisés / refusés</option><option value="intercept">intercept : HTTPS déchiffré</option></select></label>
        <label class="pxf" hidden>Liste<select name="plist"><option value="allow">seuls ces domaines</option><option value="deny">tout sauf ces domaines</option></select></label>
        <label class="pxf" hidden>Domaines<input name="pdomains" class="mono" placeholder="*.debian.org github.com" style="min-width:240px"></label>
        <label>Autres ports HTTP(S)<input name="pports" class="mono" placeholder="tcp/8080" style="width:120px"></label>
        <span class="meta">80 et 443 passent toujours par le proxy ; les autres ports suivent « Ports »</span>
      </div>
      <div class="portal-opts" hidden style="width:100%;display:flex;flex-wrap:wrap;gap:8px;align-items:end;padding:8px 0;border-top:1px dashed var(--line)">
        <label>Authentification<select name="auth" data-auth><option value="click">un clic</option><option value="password">mot de passe</option><option value="terms">accepter les conditions</option></select></label>
        <label class="pw" hidden>Mot de passe<input name="password" autocomplete="off"></label>
        <label>Durée d'une session<input name="duration" value="1h" pattern="[0-9]+(m|h)" title="ex. 30m, 2h (1m à 24h)" style="width:80px"></label>
        <label>Titre<input name="title" placeholder="Portail Omedo Labs"></label>
        <label>HTTPS non authentifié<select name="https"><option value="">refusé (reject)</option><option value="drop">sans réponse (drop)</option></select></label>
        <label class="check" title="Redirige les tests de connectivité d'Android, Apple, Windows… : le système affiche « Se connecter au réseau »"><input type="checkbox" name="detect" checked> détection par les OS</label>
        <label class="check" title="RFC 8910 / 8908 : option DHCP 114 et API JSON du portail"><input type="checkbox" name="api"> annonce DHCP 114 + API</label>
      </div>
      <button ${busy}>Ajouter</button>
    </form>
    ${incoming.length ? `<div class="card-head" style="border-top:1px solid var(--line);border-bottom:0;display:block">
      <strong>Vers ${esc(m.name)}, déclarées par d'autres modules</strong> <span class="meta">(à modifier dans le module source)</span>
      ${incoming.map(c => `<div style="display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap">
        <span class="mono">${esc(c.src)}${(c.from || []).length ? "[" + esc(c.from.join(",")) + "]" : ""} → ${esc(c.to)}</span> ${ports(c)}
        <button class="linkbtn" style="font-weight:400" data-go="m/${esc(c.src)}/net">ouvrir ${esc(c.src)}</button></div>`).join("")}</div>` : ""}
  </section>`;
}

// --- Onglet Réseau d'un module : réservations DHCP, alias DNS, liens dans les deux sens (section dns du module.yaml)
function renderNet() {
  const [name, sub] = modPage();
  if (sub !== "net") return;
  const c = config, busy = running ? "disabled" : "";
  if (!c) { $("#mod-net").innerHTML = `<div class="empty">Chargement…</div>`; return; }
  const mods = c.modules || [], m = mods.find(x => x.name === name);
  if (!m) { $("#mod-net").innerHTML = `<div class="empty">Pas de configuration réseau pour ${esc(name)}.</div>`; return; }
  let h = "";
  if (c.gateway !== "running") h += `<div class="banner"><span>Passerelle ${esc(stLabel(c.gateway))} : les modifications sont enregistrées dans le module.yaml et seront appliquées au prochain démarrage (page Passerelle, « Appliquer la configuration »).</span></div>`;
  else if (!(c.pending || []).length && !c.pendingError) h += `<div class="banner ok"><span>La passerelle est à jour avec la configuration des modules.</span></div>`;

  const aliases = Object.entries(m.aliases || {}).sort();
  const targets = (m.hosts || []).map(x => x.name);
  h += `<section class="card"><div class="card-head"><h2>Réservations DHCP et noms DNS</h2>
      <span class="meta mono">${esc(m.subnet)}.0/24 · ${esc(m.domain)}</span></div>
    <table><thead><tr><th>Nom</th><th>IP</th><th>MAC</th><th>Source</th><th></th></tr></thead><tbody>
    ${(m.hosts || []).sort((a, b) => a.ip.localeCompare(b.ip, undefined, { numeric: true })).map(x => `<tr>
      <td><strong>${esc(x.name)}</strong><span class="meta">.${esc(m.domain)}</span></td><td class="mono">${esc(x.ip)}</td>
      <td class="mono meta">${esc(x.mac || "— (DNS seulement)")}</td>
      <td class="meta">${x.source === "vm" ? "VM du module" : x.source.startsWith("attach:") ? `branchée (${esc(x.source.slice(7))})` : "réservation"}</td>
      <td>${x.source === "reservation" ? `<button class="danger" ${busy} data-cfg='${esc(JSON.stringify({ op: "host-del", module: m.name, name: x.name }))}'>Retirer</button>` : ""}</td></tr>`).join("")
      || `<tr><td colspan="5" class="empty">Aucune</td></tr>`}
    </tbody></table>
    <form class="inline" data-cfg-form="host" data-module="${esc(m.name)}" style="border-top:1px solid var(--line)">
      <strong style="width:100%">Réserver une IP (machine hors module.yaml, ex. VM importée)</strong>
      <label>Nom<input name="name" required pattern="[a-z0-9]([a-z0-9-]*[a-z0-9])?" placeholder="dc01"></label>
      <label>IP<span class="mono" style="display:flex;align-items:center;gap:2px">${esc(m.subnet)}.<input name="octet" type="number" min="2" max="99" required style="width:70px" placeholder="40"></span></label>
      <label>MAC<input name="mac" required pattern="([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}" placeholder="52:54:00:aa:bb:cc" class="mono"></label>
      <button ${busy}>Réserver</button>
      <span class="meta">IP fixe hors de la plage DHCP libre (.100-.199)</span>
    </form></section>`;

  h += `<section class="card"><div class="card-head"><h2>Alias DNS</h2><span class="meta">autre nom pour une VM : &lt;alias&gt;.${esc(m.domain)}</span></div>
    <table><thead><tr><th>Alias</th><th>Pointe vers</th><th></th></tr></thead><tbody>
    ${aliases.map(([a, t]) => `<tr><td><strong>${esc(a)}</strong><span class="meta">.${esc(m.domain)}</span></td><td class="mono">${esc(t)}</td>
      <td><button class="danger" ${busy} data-cfg='${esc(JSON.stringify({ op: "alias-del", module: m.name, name: a }))}'>Retirer</button></td></tr>`).join("")
      || `<tr><td colspan="3" class="empty">Aucun alias</td></tr>`}
    </tbody></table>
    <form class="inline" data-cfg-form="alias" data-module="${esc(m.name)}" style="border-top:1px solid var(--line)">
      <label>Alias<input name="name" required pattern="[a-z0-9]([a-z0-9-]*[a-z0-9])?" placeholder="intranet"></label>
      <label>Cible (VM ou nom complet)<input name="target" required list="targets-${esc(m.name)}" placeholder="web"></label>
      <datalist id="targets-${esc(m.name)}">${targets.map(x => `<option value="${esc(x)}">`).join("")}</datalist>
      <button ${busy}>Ajouter</button>
    </form></section>`;

  // Un lien est à sens unique : les deux sens sont montrés côte à côte, chacun avec sa case
  const others = mods.filter(x => x.name !== m.name);
  const box = (from, to) => {
    const on = (mods.find(x => x.name === from)?.links || []).includes(to);
    const restricted = !on && (mods.find(x => x.name === from)?.connections || []).some(c => c.to === to || c.to.startsWith(to + "/"));
    return `<label class="check" style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" ${on ? "checked" : ""} ${busy}
      data-cfg='${esc(JSON.stringify({ op: on ? "unlink" : "link", module: from, target: to }))}'> ${on ? "oui (tout)" : restricted ? "restreint (voir connexions)" : "non"}</label>`;
  };
  h += `<section class="card"><div class="card-head"><h2>Liens avec les autres modules</h2>
      <span class="meta">joindre = ouvrir des connexions et résoudre les noms DNS ; les réponses reviennent toujours. Chaque sens se règle à part.</span></div>
    ${others.length ? `<table><thead><tr><th>Module</th><th>${esc(m.name)} peut joindre ce module</th><th>ce module peut joindre ${esc(m.name)}</th></tr></thead><tbody>
      ${others.map(o => `<tr><td><strong>${esc(o.name)}</strong><div class="meta mono">${esc(o.subnet)}.0/24 · ${esc(o.domain)}</div></td>
        <td>${box(m.name, o.name)}</td><td>${box(o.name, m.name)}</td></tr>`).join("")}
    </tbody></table>` : `<div class="empty">Aucun autre module.</div>`}</section>`;
  h += connCard(m, mods, busy);
  $("#mod-net").innerHTML = h;
}

// --- Onglet Fichiers : modules/<m>/files/, copiés dans les VMs par files: du module.yaml
// fx.open : fichier ouvert dans l'éditeur texte (create : pas encore enregistré)
const fx = { module: "", list: null, dir: "", open: null, busy: "" };
const fdirty = () => !!fx.open && (fx.open.create || fx.open.text !== fx.open.saved);
const fpath = p => `files/${p}`;
const fsize = n => n < 1024 ? `${n} o` : n < 1 << 20 ? `${(n / 1024).toFixed(1)} Kio` : `${(n / (1 << 20)).toFixed(1)} Mio`;
const fq = (path, extra = "") => `module=${encodeURIComponent(fx.module)}&path=${encodeURIComponent(path)}${extra}`;

async function loadFiles(name) {
  if (name !== fx.module && fdirty()) {
    if (!(await ask({ title: "Fichier non enregistré", text: `Les modifications de ${fpath(fx.open.path)} (${fx.module}) seront perdues.`, ok: "Abandonner les modifications", danger: true }))) {
      go(`m/${fx.module}/files`); return;
    }
  }
  if (name !== fx.module) Object.assign(fx, { module: name, dir: "", open: null });
  try { fx.list = await (await api(`/api/files?module=${encodeURIComponent(name)}`)).json(); }
  catch (e) { $("#mod-files").innerHTML = `<div class="empty err">${esc(e.message)}</div>`; return; }
  renderFiles();
}

function renderFiles() {
  const [name, sub] = modPage();
  if (sub !== "files" || !fx.list || fx.module !== name) return;
  const L = fx.list, files = L.files || [], dirs = files.filter(f => f.dir).map(f => f.path);
  if (fx.dir && !dirs.includes(fx.dir)) fx.dir = "";
  const ref = u => `<span class="pill mono" title="${u.template ? "template : ${…} remplacés à la copie" : "copié tel quel"}">${esc(u.vm)} : ${esc(u.dest)}${u.template ? " ⟨t⟩" : ""}</span>`;
  let h = `<section class="card" id="f-card">
    <div class="ed-bar">
      <input type="file" id="f-pick" multiple hidden>
      <button class="primary" id="f-upload">Envoyer des fichiers…</button>
      <label class="meta">dans <select id="f-dir"><option value="">files/</option>${dirs.map(d => `<option ${d === fx.dir ? "selected" : ""} value="${esc(d)}">files/${esc(d)}/</option>`).join("")}</select></label>
      <button id="f-newfile">Nouveau fichier…</button>
      <button id="f-newdir">Nouveau dossier…</button>
      <span class="spacer"></span>
      ${fx.busy ? `<span class="doing"><span class="spin"></span>${esc(fx.busy)}</span>` : `<span class="meta">ou glisser-déposer des fichiers ici</span>`}
    </div>
    <div class="card-desc meta">Les fichiers sont copiés dans une VM à sa création (<span class="mono">files:</span> du module.yaml) :
      une VM existante ne reçoit pas les changements d'elle-même. ⟨t⟩ : template, les <span class="mono">\${…}</span> sont remplacés.</div>
    ${L.warning ? `<div class="banner" style="border-radius:0;border-width:0 0 1px"><span>${esc(L.warning)}</span></div>` : ""}
    <table class="ftree"><thead><tr><th>Nom</th><th>Taille</th><th>Modifié</th><th>Copié dans (VM : destination)</th><th></th></tr></thead><tbody>
    ${files.map(f => {
      const depth = f.path.split("/").length - 1, base = f.path.split("/").pop();
      const act = f.dir ? "" : `${f.text ? `<button data-fedit="${esc(f.path)}">Éditer</button>` : ""}<button data-fget="${esc(f.path)}" title="Télécharger">⤓</button>`;
      return `<tr><td style="padding-left:${16 + depth * 20}px"><span class="ico">${f.dir ? "▸" : "·"}</span>${f.dir ? `<strong>${esc(base)}/</strong>`
          : f.text ? `<button class="linkbtn" style="font-weight:400" data-fedit="${esc(f.path)}">${esc(base)}</button>` : esc(base)}</td>
        <td class="meta">${f.dir ? "" : fsize(f.size)}</td>
        <td class="meta">${new Date(f.mod).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" })}</td>
        <td><div class="tags">${f.dir ? "" : (f.uses || []).map(ref).join("") || `<span class="meta">non utilisé</span>`}</div></td>
        <td><div class="actions" style="justify-content:flex-end">${act}
          <button data-fmv="${esc(f.path)}">Renommer…</button>
          <button class="danger" data-frm='${esc(JSON.stringify([f.path, f.dir, (f.uses || []).length]))}'>Supprimer</button></div></td></tr>`;
    }).join("") || `<tr><td colspan="5" class="empty">Aucun fichier.</td></tr>`}
    </tbody></table>
    ${(L.missing || []).length ? `<div class="card-head" style="border-top:1px solid var(--line);border-bottom:0;display:block">
      <strong class="err">Référencés par module.yaml mais absents</strong>
      ${L.missing.map(u => `<div style="display:flex;gap:10px;align-items:center;margin-top:6px"><span class="mono">${esc(u.src)}</span> ${ref(u)}
        <span class="spacer"></span><button data-fcreate="${esc(u.src.replace(/^files\//, ""))}">Créer (texte)</button></div>`).join("")}</div>` : ""}
    ${(L.outside || []).length ? `<div class="card-desc meta" style="border-top:1px solid var(--line)">Hors de files/ (non gérés ici) :
      ${L.outside.map(u => `<span class="mono">${esc(u.src)}</span>`).join(", ")}</div>` : ""}
  </section>`;

  const o = fx.open;
  if (o) h += `<section class="card"><div class="ed-bar">
      <strong class="mono">${esc(fpath(o.path))}</strong>
      <span id="f-state" class="state"></span>
      <span class="spacer"></span>
      <button class="primary" id="f-save" title="Ctrl+S">${o.create ? "Créer" : "Enregistrer"}</button>
      <button id="f-close">Fermer</button>
    </div><textarea class="ftext" id="f-text" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea></section>`;
  $("#mod-files").innerHTML = h;
  if (o) { $("#f-text").value = o.text; paintFileState(); }
}

function paintFileState() {
  const st = $("#f-state");
  if (!st || !fx.open) return;
  st.innerHTML = fx.open.create ? `<span class="pill">nouveau</span>` : fdirty() ? "<strong>modifié</strong>" : `<span class="meta">enregistré</span>`;
  $("#f-save").disabled = !fdirty();
}

async function openFile(path, create = false) {
  if (fx.open && fdirty() && fx.open.path !== path &&
      !(await ask({ title: "Fichier non enregistré", text: `Les modifications de ${fpath(fx.open.path)} seront perdues.`, ok: "Abandonner les modifications", danger: true }))) return;
  if (create) fx.open = { path, text: "", saved: "", hash: "", create: true };
  else {
    try {
      const d = await (await api(`/api/file?${fq(path)}`)).json();
      fx.open = { path, text: d.text, saved: d.text, hash: d.hash, create: false };
    } catch (e) { toast(e.message, true); return; }
  }
  renderFiles(); render();
  $("#f-text")?.focus();
  $("#f-text")?.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

async function saveFile() {
  const o = fx.open;
  if (!o || !fdirty()) return;
  try {
    const d = await (await api("/api/file/save", { method: "POST", body: JSON.stringify({ module: fx.module, path: o.path, text: o.text, hash: o.hash, create: o.create }) })).json();
    Object.assign(o, { saved: o.text, hash: d.hash, create: false });
    toast(`${fpath(o.path)} enregistré`);
  } catch (e) { toast(e.message, true); return; }
  await loadFiles(fx.module); render();
}

async function closeFile() {
  if (fdirty() && !(await ask({ title: "Fichier non enregistré", text: `Les modifications de ${fpath(fx.open.path)} seront perdues.`, ok: "Fermer sans enregistrer", danger: true }))) return;
  fx.open = null; renderFiles(); render();
}

// Envoi : un fichier après l'autre ; ceux qui existent déjà ne sont remplacés qu'après confirmation
async function uploadFiles(list) {
  const items = [...list].filter(f => f.size > 0 || f.type !== ""); // un dossier glissé arrive comme un fichier vide sans type
  if (!items.length) { toast("Rien à envoyer (les dossiers ne sont pas pris : envoyer leurs fichiers)", true); return; }
  const big = items.find(f => f.size > 512 * 1024 * 1024);
  if (big) { toast(`${big.name} : plus de 512 Mio`, true); return; }
  const target = f => (fx.dir ? fx.dir + "/" : "") + f.name;
  const existing = new Set((fx.list?.files || []).filter(f => !f.dir).map(f => f.path));
  const clash = items.filter(f => existing.has(target(f)));
  if (clash.length && !(await ask({ title: "Remplacer ?", danger: true, ok: "Remplacer",
      text: `Déjà dans files/ : ${clash.map(target).join(", ")}` }))) return;
  let n = 0;
  for (const f of items) {
    fx.busy = `envoi de ${f.name} (${fsize(f.size)})…`; renderFiles();
    try {
      await api(`/api/file/upload?${fq(target(f), clash.includes(f) ? "&overwrite=1" : "")}`,
        { method: "POST", body: f, headers: { "Content-Type": "application/octet-stream" } });
      n++;
    } catch (e) { toast(`${f.name} : ${e.message}`, true); }
  }
  fx.busy = "";
  if (n) toast(`${n} fichier(s) envoyé(s) dans files/${fx.dir ? fx.dir + "/" : ""}`);
  await loadFiles(fx.module);
}

async function fileOp(body, okMsg) {
  let ok = false;
  try { await api("/api/file/op", { method: "POST", body: JSON.stringify({ module: fx.module, ...body }) }); toast(okMsg); ok = true; }
  catch (e) { toast(e.message, true); }
  await loadFiles(fx.module);
  return ok;
}

document.addEventListener("click", async e => {
  const t = e.target.closest("#f-upload, #f-newfile, #f-newdir, #f-save, #f-close, [data-fedit], [data-fget], [data-fmv], [data-frm], [data-fcreate]");
  if (!t) return;
  const prefix = fx.dir ? fx.dir + "/" : "";
  const relPattern = "(?!/).+", relHint = "chemin dans files/, ex. conf/app.ini (sans .. ni / au début)";
  if (t.id === "f-upload") $("#f-pick").click();
  else if (t.id === "f-newfile") {
    const p = await ask({ title: "Nouveau fichier texte", text: "Chemin dans files/ (les dossiers manquants sont créés) :", input: true, value: prefix, pattern: relPattern, hint: relHint, ok: "Créer" });
    if (p) openFile(p.replace(/^\/+/, ""), true);
  } else if (t.id === "f-newdir") {
    const p = await ask({ title: "Nouveau dossier", text: "Chemin dans files/ :", input: true, value: prefix, pattern: relPattern, hint: relHint, ok: "Créer" });
    if (p) fileOp({ op: "mkdir", path: p }, `dossier files/${p} créé`);
  } else if (t.id === "f-save") saveFile();
  else if (t.id === "f-close") closeFile();
  else if (t.dataset.fedit) openFile(t.dataset.fedit);
  else if (t.dataset.fcreate) openFile(t.dataset.fcreate, true);
  else if (t.dataset.fget) {
    try {
      const blob = await (await api(`/api/file/raw?${fq(t.dataset.fget)}`)).blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = t.dataset.fget.split("/").pop();
      document.body.append(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
    } catch (err) { toast(err.message, true); }
  } else if (t.dataset.fmv) {
    const from = t.dataset.fmv;
    const to = await ask({ title: `Renommer files/${from}`, text: "Nouveau chemin dans files/ (un autre dossier : déplacement).\nPenser à mettre à jour les src: du module.yaml qui le citent.",
      input: true, value: from, pattern: relPattern, hint: relHint, ok: "Renommer" });
    if (to && to !== from) {
      if (!(await fileOp({ op: "rename", path: from, to }, `files/${from} → files/${to}`))) return;
      // le fichier ouvert suit (lui-même, ou le dossier qui le contient)
      if (fx.open && (fx.open.path === from || fx.open.path.startsWith(from + "/"))) { fx.open.path = to + fx.open.path.slice(from.length); renderFiles(); }
    }
  } else if (t.dataset.frm) {
    const [path, dir, used] = JSON.parse(t.dataset.frm);
    const ok = await ask({ title: `Supprimer files/${path}${dir ? "/" : ""} ?`, danger: true, ok: "Supprimer",
      text: (dir ? "Le dossier et tout son contenu seront supprimés." : "Le fichier sera supprimé.") +
        (used ? "\nIl est utilisé par le module.yaml : le module deviendra invalide tant que les src: ne seront pas corrigés." : "") });
    if (ok) {
      if (await fileOp({ op: "delete", path }, `files/${path} supprimé`) && fx.open && (fx.open.path === path || fx.open.path.startsWith(path + "/"))) { fx.open = null; renderFiles(); render(); }
    }
  }
});
document.addEventListener("change", e => {

  if (f && (e.target.dataset.via !== undefined || e.target.dataset.auth !== undefined || e.target.dataset.pmode !== undefined)) {
    $(".portal-opts", f).hidden = f.via.value !== "portal";
    $(".proxy-opts", f).hidden = f.via.value !== "proxy";

    f.pdomains.required = f.via.value === "proxy" && f.pmode.value === "filter";

document.addEventListener("change", e => {

document.addEventListener("input", e => {

document.addEventListener("keydown", e => {

// Glisser-déposer sur la carte des fichiers
for (const ev of ["dragenter", "dragover"]) document.addEventListener(ev, e => {

// --- Page Trafic : journal du proxy de la passerelle (connexions via: proxy), accès à mitmweb
const tr = { events: null, err: "", q: "", module: "", action: "" };
async function loadTraffic() {
  if (!$("#tr-list")) renderTrafficShell();
  try { tr.events = await (await api("/api/proxy/log?n=500")).json(); tr.err = ""; }
  catch (e) { tr.err = e.message; }
  renderTraffic();
}
function renderTrafficShell() {
  $("#view-traffic").innerHTML = `<section class="card">
    <div class="card-head"><h2>Trafic du proxy</h2>
      <span class="meta">connexions <span class="mono">via: proxy</span> : log (HTTPS non déchiffré), filter, intercept</span>
      <span class="spacer"></span>
      <button id="tr-web" title="Interface de mitmproxy : inspecter, modifier, rejouer (tunnel SSH, 127.0.0.1 seulement)">Ouvrir mitmweb</button>
      <button id="tr-refresh">↻</button></div>
    <form class="inline" id="tr-filters" style="border-bottom:1px solid var(--line)">
      <label>Module<select name="module"><option value="">tous</option></select></label>
      <label>Action<select name="action"><option value="">toutes</option><option>passé</option><option>refusé</option><option>intercepté</option></select></label>
      <label>Recherche<input name="q" placeholder="domaine, source, URL…" style="min-width:220px"></label>
      <span class="meta" id="tr-count"></span>
    </form>
    <div id="tr-list"><div class="empty">Chargement…</div></div>
    <div class="card-desc meta" style="border-top:1px solid var(--line)">Mode intercept : une VM ne déchiffre sans alerte que si elle fait confiance à
      l'autorité d'interception (page PKI, « Confiance dans les VMs ») ; sinon on observe son comportement face au certificat inconnu.</div>
  </section>`;
}
function renderTraffic() {
  const box = $("#tr-list");
  if (!box) return;
  const mods = [...new Set((tr.events || []).map(e => e.module).filter(Boolean))].sort();
  const sel = $("#tr-filters").module;
  if (sel.options.length - 1 !== mods.length) sel.innerHTML = `<option value="">tous</option>` + mods.map(m => `<option ${m === tr.module ? "selected" : ""}>${esc(m)}</option>`).join("");
  if (tr.err) { box.innerHTML = `<div class="empty err">${esc(tr.err)}</div>`; return; }
  const q = tr.q.toLowerCase();
  const list = (tr.events || []).filter(e => (!tr.module || e.module === tr.module) && (!tr.action || e.action === tr.action) &&
    (!q || [e.host, e.src, e.url, e.dst, e.target].some(x => (x || "").toLowerCase().includes(q))));
  $("#tr-count").textContent = `${list.length} / ${(tr.events || []).length} événement(s)`;
  const cls = { "passé": "", "refusé": "never", "intercepté": "open" };
  box.innerHTML = list.length ? `<table><thead><tr><th>Heure</th><th>Source</th><th>Action</th><th>Requête</th><th>Résultat</th></tr></thead><tbody>
    ${list.slice(0, 500).map(e => `<tr>

      <td class="mono">${esc(e.src)}<div class="meta">${esc(e.module)} → ${esc(e.target)}</div></td>
      <td><span class="pill ${cls[e.action] || ""}">${esc(e.action)}</span><div class="meta">${esc(e.mode)}</div></td>
      <td style="max-width:520px;overflow-wrap:anywhere">${e.kind === "http" ? `<span class="mono">${esc(e.method)}</span> ${esc(e.url)}`
        : `<span class="meta">TLS</span> ${esc(e.host || "(sans nom)")} <span class="meta mono">${esc(e.dst)}</span>`}</td>
      <td class="meta">${e.status ? esc(e.status) + (e.size ? " · " + fsize(e.size) : "") : ""}${e.why ? esc(e.why) : ""}${e.error ? `<span class="err">${esc(e.error)}</span>` : ""}</td></tr>`).join("")}
    </tbody></table>` : `<div class="empty">Rien pour l'instant (aucune connexion via: proxy, ou pas encore de trafic).</div>`;
}
document.addEventListener("input", e => {
  const f = e.target.closest("#tr-filters");
